  </div>;
}

function LedgerTables({ transactions, holdings, fundNames, navMap, priceHistory,
  effectiveNavMap, estimatedNavMap, trackingMap, onTracking, quoteState, quoteAt, onRefresh, canRefresh }) {
  const { holdingsByCcy, housesByCcy, monthsByCcy } = useMemo(() => {
    const holdingsByCcy = {}, houseMap = {}, monthMap = {};
    for (const [code, h] of Object.entries(holdings)) {
      if (!h || h.units <= 0) continue;
      const ccy = h.currency || DEFAULT_CCY;
      const house = h.house || "未分類";
      const valuation = valueHolding(h, effectiveNavMap[code]);
      const cost = Number(h.cost) || 0;
      const manual = Number(navMap[code]);
      const estimated = Number(estimatedNavMap[code]);
      const known = latestKnownNav(code, priceHistory, navMap);
      const source = valuation.missing ? "缺淨值"
        : Number.isFinite(estimated) && estimated > 0 ? "追蹤估算"
        : Number.isFinite(manual) && manual > 0 ? "手填淨值"
        : known && known.date ? `價格紀錄 ${known.date}` : "價格紀錄";
      const row = {
        code, name: fundNames[code] || "", house, units: h.units, cost,
        nav: valuation.missing ? null : Number(effectiveNavMap[code]),
        marketValue: valuation.marketValue,
        gain: valuation.missing ? null : valuation.marketValue - cost,
        source, tracked: !!trackingMap[code],
      };
      if (!holdingsByCcy[ccy]) holdingsByCcy[ccy] = [];
      holdingsByCcy[ccy].push(row);
      const key = `${ccy}\u0000${house}`;
      if (!houseMap[key]) houseMap[key] = { ccy, house, count: 0, cost: 0, marketValue: 0, missing: 0 };
      const group = houseMap[key];
      group.count += 1;
      group.cost += cost;
      if (valuation.missing) group.missing += 1;
      else group.marketValue += valuation.marketValue;
    }
    for (const rows of Object.values(holdingsByCcy)) {
      rows.sort((a, b) => (b.marketValue ?? -1) - (a.marketValue ?? -1));
    }
    const housesByCcy = {};
    for (const group of Object.values(houseMap)) {
      if (!housesByCcy[group.ccy]) housesByCcy[group.ccy] = [];
      housesByCcy[group.ccy].push(group);
    }
    for (const rows of Object.values(housesByCcy)) rows.sort((a, b) => b.cost - a.cost);

    for (const t of transactions) {
      if (!t || !t.date || !["buy", "sell", "dividend"].includes(t.type)) continue;
      const ccy = t.currency || DEFAULT_CCY;
      const month = String(t.date).slice(0, 7);
      const key = `${ccy}\u0000${month}`;
      if (!monthMap[key]) monthMap[key] = { ccy, month, buy: 0, sell: 0, dividend: 0 };
      const amount = Number(t.amount) || 0;
      const fee = Number(t.fee) || 0;
      if (t.type === "buy") monthMap[key].buy += amount + fee;
      if (t.type === "sell") monthMap[key].sell += amount - fee;
      if (t.type === "dividend") monthMap[key].dividend += amount - fee;
    }
    const monthsByCcy = {};
    for (const row of Object.values(monthMap)) {
      row.net = row.sell + row.dividend - row.buy;
      if (!monthsByCcy[row.ccy]) monthsByCcy[row.ccy] = [];
      monthsByCcy[row.ccy].push(row);
    }
    for (const rows of Object.values(monthsByCcy)) rows.sort((a, b) => b.month.localeCompare(a.month));
    return { holdingsByCcy, housesByCcy, monthsByCcy };
  }, [transactions, holdings, fundNames, navMap, priceHistory, effectiveNavMap, estimatedNavMap, trackingMap]);

  const chartCurrencies = [...new Set([...Object.keys(holdingsByCcy), ...Object.keys(monthsByCcy)])].sort();
  const blockStyle = { ...s.ledgerSection, padding: 16, marginBottom: 16 };
  const titleStyle = { margin: "0 0 10px", fontSize: 14, color: "var(--text)", fontWeight: 600 };
  const ccyStyle = { margin: "14px 0 7px", fontSize: 11, color: "var(--text-4)", fontWeight: 600 };
  const empty = <p style={{ margin: 0, fontSize: 12, color: "var(--text-4)" }}>暫無資料</p>;
  const gainColor = (n) => n == null ? "var(--text-4)" : n >= 0 ? POS_COLOR : NEG_COLOR;

  return (
    <>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
        <div style={{ ...s.sectionTitle, marginBottom: 0 }}><span style={s.sectionBar} />資料表</div>
        {canRefresh && <button type="button" className="fl-ghost" style={{ ...s.ghostBtn, fontSize: 11, flexShrink: 0 }}
          disabled={quoteState === "loading"} onClick={onRefresh}>
          <RefreshCw size={13} /> {quoteState === "loading" ? "更新中" : "更新行情"}
        </button>}
      </div>
      <p style={{ fontSize: 11.5, color: "var(--text-4)", lineHeight: 1.5, margin: "0 0 16px" }}>
        各幣種分開列示；手機可左右滑動表格。估值按最新可用淨值計算，未必是今日結算價。
        {quoteState === "ok" && quoteAt ? ` 行情更新：${quoteAt.toLocaleString("zh-TW")}` : ""}
        {quoteState === "error" ? " 行情更新失敗，會沿用已儲存的淨值。" : ""}
      </p>

      <section style={blockStyle}>
        <h2 style={titleStyle}>圖表總覽</h2>
        {chartCurrencies.length === 0 ? empty : chartCurrencies.map((ccy) => (
            <div key={ccy}>
              <div style={ccyStyle}>{ccy}</div>
              <div className="fl-viz-grid">
                <AllocationChart rows={holdingsByCcy[ccy] || []} ccy={ccy} />
                <CashFlowChart rows={monthsByCcy[ccy] || []} ccy={ccy} />
              </div>
            </div>
          ))}
      </section>

      <section style={blockStyle}>
        <h2 style={titleStyle}>基金持倉</h2>
        {Object.keys(holdingsByCcy).length === 0 ? empty : Object.entries(holdingsByCcy).map(([ccy, rows]) => (
          <div key={ccy}>
            <div style={ccyStyle}>{ccy} · {rows.length} 檔</div>
            <div className="fl-table-scroll">
              <table className="fl-data-table" style={{ minWidth: 750 }} aria-label={`${ccy} 基金持倉`}>
                <thead><tr><th>基金</th><th>浮動盈虧</th><th>預估市值</th><th>持倉成本</th><th>單位數</th><th>淨值</th><th>平台</th><th>來源／追蹤</th></tr></thead>
                <tbody>{rows.map((row) => (
                  <tr key={row.code}>
                    <td><div style={{ ...s.mono, fontWeight: 600, color: "var(--text)" }}>{row.code}</div>
                      {row.name && <div style={{ maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis", color: "var(--text-4)", fontSize: 10 }} title={row.name}>{row.name}</div>}</td>
                    <td style={{ color: gainColor(row.gain), fontWeight: 600 }}>{row.gain == null ? "—" : fmtSignedMoney(row.gain, ccy)}</td>
                    <td>{row.marketValue == null ? "缺淨值" : fmtMoney(row.marketValue, ccy)}</td>
                    <td>{fmtMoney(row.cost, ccy)}</td>
                    <td>{fmtNum(row.units, 3)}</td>
                    <td>{row.nav == null ? "—" : fmtNum(row.nav, 4)}</td>
                    <td>{row.house}</td>
                    <td><span style={{ color: "var(--text-4)", marginRight: 8 }}>{row.source}</span>
                      <button type="button" className="fl-realized-btn" style={{ color: "var(--accent)", fontSize: 11 }}
                        onClick={() => onTracking(row.code)}>{row.tracked ? "調整追蹤" : "設定追蹤"}</button></td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
        ))}
      </section>

      <section style={blockStyle}>
        <h2 style={titleStyle}>銀行／平台彙總</h2>
        <p style={{ margin: "0 0 7px", fontSize: 11, color: "var(--text-4)" }}>依每檔基金最後一筆交易所記錄的平台歸類。</p>
        {Object.keys(housesByCcy).length === 0 ? empty : Object.entries(housesByCcy).map(([ccy, rows]) => (
          <div key={ccy}>
            <div style={ccyStyle}>{ccy}</div>
            <div className="fl-table-scroll">
              <table className="fl-data-table" style={{ minWidth: 540 }} aria-label={`${ccy} 平台彙總`}>
                <thead><tr><th>平台</th><th>基金數</th><th>浮動盈虧</th><th>預估市值</th><th>持倉成本</th></tr></thead>
                <tbody>{rows.map((row) => {
                  const gain = row.missing ? null : row.marketValue - row.cost;
                  return <tr key={row.house}>
                    <td style={{ fontWeight: 600 }}>{row.house}</td>
                    <td>{row.count}</td>
                    <td style={{ color: gainColor(gain), fontWeight: 600 }}>{gain == null ? "—" : fmtSignedMoney(gain, ccy)}</td>
                    <td>{row.missing ? `缺 ${row.missing} 檔淨值` : fmtMoney(row.marketValue, ccy)}</td>
                    <td>{fmtMoney(row.cost, ccy)}</td>
                  </tr>;
                })}</tbody>
              </table>
            </div>
          </div>
        ))}
      </section>

      <section style={blockStyle}>
        <h2 style={titleStyle}>每月資金進出</h2>
        <p style={{ margin: "0 0 7px", fontSize: 11, color: "var(--text-4)" }}>淨流入＝贖回收入＋配息－申購支出；交易費用已計入。這是現金流，並非投資報酬。</p>
        {Object.keys(monthsByCcy).length === 0 ? empty : Object.entries(monthsByCcy).map(([ccy, rows]) => (
          <div key={ccy}>
            <div style={ccyStyle}>{ccy} · {rows.length} 個月</div>
            <div className="fl-table-scroll" style={{ maxHeight: 420, overflowY: "auto" }}>
              <table className="fl-data-table" style={{ minWidth: 560 }} aria-label={`${ccy} 每月資金進出`}>
                <thead><tr><th>月份</th><th>淨流入</th><th>申購支出</th><th>贖回收入</th><th>配息</th></tr></thead>
                <tbody>{rows.map((row) => <tr key={row.month}>
                  <td style={{ ...s.mono, fontWeight: 600 }}>{row.month}</td>
                  <td style={{ color: gainColor(row.net), fontWeight: 600 }}>{fmtSignedMoney(row.net, ccy)}</td>
                  <td>{fmtMoney(row.buy, ccy)}</td>
                  <td>{fmtMoney(row.sell, ccy)}</td>
                  <td>{fmtMoney(row.dividend, ccy)}</td>
                </tr>)}</tbody>
              </table>
            </div>
          </div>
        ))}
      </section>
    </>
  );
}

function buildAllocationSnapshot(holdings, effectiveNavMap, plan) {
  const values = Object.fromEntries([...PLAN_CATEGORIES.map((c) => c.key), "other"].map((key) => [key, 0]));
  const missing = { category: [], nav: [], fx: [] };
  let count = 0;
  for (const [code, holding] of Object.entries(holdings)) {
    if (!holding || holding.units <= 0) continue;
    count++;
    const category = plan.fundCategories[code];
    if (!PLAN_CATEGORY_KEYS.has(category)) missing.category.push(code);
    const valuation = valueHolding(holding, effectiveNavMap[code]);
    if (valuation.missing) missing.nav.push(code);
    const ccy = holding.currency || DEFAULT_CCY;
    const fx = ccy === DEFAULT_CCY ? 1 : Number(plan.fxToHKD[ccy]);
    if (!Number.isFinite(fx) || fx <= 0) missing.fx.push(ccy);
    if (PLAN_CATEGORY_KEYS.has(category) && !valuation.missing && Number.isFinite(fx) && fx > 0) {
      values[category] += valuation.marketValue * fx;
    }
  }
  missing.fx = [...new Set(missing.fx)];
  const complete = count > 0 && !missing.category.length && !missing.nav.length && !missing.fx.length;
  const total = Object.values(values).reduce((sum, value) => sum + value, 0);
  const pct = Object.fromEntries(Object.entries(values).map(([key, value]) => [key, complete && total > 0 ? value / total * 100 : null]));
  return { count, complete: complete && total > 0, missing, values, total, pct };
}

function AllocationPlanCard({ snapshot, plan, holdings, fundNames, navMap, priceHistory, onSetup, snoozedToday, onSnooze }) {
  const reached = [];
  const watching = [];
  if (snapshot.complete) {
    for (const [code, h] of Object.entries(holdings)) {
      if (!h || h.units <= 0) continue;
      const category = plan.fundCategories[code];
      if (category !== "hsi" && category !== "china") continue;
      const target = plan.targets[category];
      if (snapshot.pct[category] <= target.max) continue;
      const threshold = Number(plan.recoveryNav[code]);
      const known = latestKnownNav(code, priceHistory, navMap);
      const item = { code, name: fundNames[code] || code, category, threshold, current: known && known.price };
      if (Number.isFinite(threshold) && threshold > 0 && known && known.price >= threshold) reached.push(item);
      else watching.push(item);
    }
  }
  const notice = snapshot.missing;
  const noticeParts = [
    notice.category.length ? `${notice.category.length} 檔未分類` : "",
    notice.nav.length ? `${notice.nav.length} 檔缺淨值` : "",
    notice.fx.length ? `${notice.fx.join("、")} 缺換算匯率` : "",
  ].filter(Boolean);

  return <section style={{ ...s.ledgerSection, padding: 16, marginBottom: 20 }}>
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
      <h2 style={{ margin: 0, fontSize: 15, color: "var(--text)" }}>我的配置計畫</h2>
      <button type="button" className="fl-ghost" style={{ ...s.ghostBtn, fontSize: 11, flexShrink: 0 }} onClick={onSetup}>設定計畫</button>
    </div>
    <p style={{ fontSize: 11.5, color: "var(--text-4)", lineHeight: 1.6, margin: "0 0 15px" }}>
      按目前持倉的預估市值換算為港幣；色帶是你設定的目標區間，直線是目前占比。只是檢視工具，不會替你交易。
    </p>
    {!snapshot.complete && <div role="status" style={{ padding: "10px 12px", borderRadius: 8, background: "var(--inset)", color: "var(--warn)", fontSize: 12, lineHeight: 1.6, marginBottom: 14 }}>
      {snapshot.count === 0 ? "尚無持倉；有交易紀錄後可開始設定。" : `配置尚不能完整計算：${noticeParts.join("、") || "市值總額為零"}。請點「設定計畫」補齊。`}
    </div>}
    {PLAN_CATEGORIES.map((category) => {
      const target = plan.targets[category.key];
      const actual = snapshot.pct[category.key];
      const state = actual == null ? "" : actual > target.max ? "超配" : actual < target.min ? "低於目標" : "目標內";
      const color = actual == null ? "var(--text-4)" : actual > target.max ? "var(--warn)" : actual < target.min ? "var(--text-3)" : "var(--pos)";
      return <div key={category.key} style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12, marginBottom: 6 }}>
          <span style={{ fontWeight: 600 }}>{category.label} <span style={{ color: "var(--text-4)", fontWeight: 400 }}>目標 {target.min}–{target.max}%</span></span>
          <span style={{ color, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
            {actual == null ? "—" : `${actual.toFixed(1)}% · ${state}`}
          </span>
        </div>
        <div role="img" aria-label={`${category.label} 目標 ${target.min} 至 ${target.max}%，目前 ${actual == null ? "未能計算" : actual.toFixed(1) + "%"}`}
          style={{ position: "relative", height: 14, background: "var(--inset)", borderRadius: 7, overflow: "hidden" }}>
          <div style={{ position: "absolute", left: `${target.min}%`, width: `${target.max - target.min}%`, top: 0, bottom: 0, background: category.color, opacity: 0.45 }} />
          {actual != null && <div style={{ position: "absolute", left: `clamp(2px, ${actual}%, calc(100% - 2px))`, top: 0, bottom: 0, width: 3, background: "var(--text)", transform: "translateX(-50%)" }} />}
        </div>
      </div>;
    })}
    {snapshot.complete && snapshot.pct.other > 0 && <div style={{ fontSize: 11.5, color: "var(--text-3)", marginBottom: 11 }}>其他基金：{snapshot.pct.other.toFixed(1)}%</div>}
    {snapshot.complete && <div style={{ fontSize: 11, color: "var(--text-4)", marginBottom: 12 }}>已納入持倉市值：{fmtMoney(snapshot.total, DEFAULT_CCY)}（手填匯率僅用於此配置計算）</div>}
    {reached.length > 0 && !snoozedToday && <div role="status" style={{ background: "var(--accent-22)", border: "1px solid var(--pos-border)", borderRadius: 9, padding: "11px 12px", fontSize: 12, lineHeight: 1.6 }}>
      <strong>回升觀察提醒</strong>：{reached.map((item) => `${item.name}（已存淨值 ${fmtNum(item.current, 4)}／觀察價 ${fmtNum(item.threshold, 4)}）`).join("、")}已達到你設定的觀察價，且類別仍高於目標上限。請先核對最新淨值，再自行檢視是否分批調整、逐步轉向全球與美國基金。
      <button type="button" className="fl-realized-btn" style={{ color: "var(--accent)", marginLeft: 8 }} onClick={onSnooze}>今天不再提醒</button>
    </div>}
    {watching.length > 0 && <p style={{ margin: "10px 0 0", fontSize: 11.5, color: "var(--text-3)", lineHeight: 1.6 }}>
      超過目標、繼續觀察：{watching.map((item) => `${item.name}${item.threshold > 0 ? `（觀察淨值 ${fmtNum(item.threshold, 4)}）` : "（尚未設定觀察價）"}`).join("、")}。
    </p>}
    <p style={{ margin: "12px 0 0", fontSize: 10.5, color: "var(--text-4)", lineHeight: 1.5 }}>
      僅在開啟帳本時檢查已儲存的淨值；不會背景推播，也不代表價格已即時更新。
    </p>
  </section>;
}

function AllocationSettingsModal({ plan, holdings, fundNames, navMap, priceHistory, onSave, onClose }) {
  const [draft, setDraft] = useState(() => normalizeAllocationPlan(plan));
  const [validation, setValidation] = useState("");
  const current = Object.entries(holdings).filter(([, h]) => h && h.units > 0).sort(([a], [b]) => a.localeCompare(b, "zh-TW"));
  const currencies = [...new Set(current.map(([, h]) => h.currency || DEFAULT_CCY))].filter((ccy) => ccy !== DEFAULT_CCY).sort();
  function save() {
    const targets = PLAN_CATEGORIES.map((c) => draft.targets[c.key]);
    if (targets.some((r) => r.min === "" || r.max === "" || !Number.isFinite(Number(r.min)) || !Number.isFinite(Number(r.max)) || Number(r.min) < 0 || Number(r.max) > 100 || Number(r.min) > Number(r.max))) {
      setValidation("目標區間須為 0–100%，且下限不能高於上限。"); return;
    }
    if (targets.reduce((sum, r) => sum + Number(r.min), 0) > 100 || targets.reduce((sum, r) => sum + Number(r.max), 0) < 100) {
      setValidation("四個目標區間須能組成 100%；請調整上下限。"); return;
    }
    if (Object.values(draft.fxToHKD).some((rate) => rate !== "" && (!Number.isFinite(Number(rate)) || Number(rate) <= 0)) ||
      Object.values(draft.recoveryNav).some((nav) => nav !== "" && (!Number.isFinite(Number(nav)) || Number(nav) <= 0))) {
      setValidation("匯率及觀察淨值請填正數，或留空稍後設定。"); return;
    }
    onSave(normalizeAllocationPlan(draft));
  }
  const labelStyle = { display: "block", fontSize: 11, color: "var(--text-3)", marginBottom: 5 };
  return <div style={s.modalBackdrop} onClick={onClose}>
    <div style={{ ...s.modal, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
      <div style={s.modalHeader}>
        <h2 style={s.modalTitle}>設定配置計畫</h2>
        <button type="button" style={s.closeBtn} onClick={onClose} aria-label="關閉"><X size={18} /></button>
      </div>
      <p style={{ fontSize: 11.5, color: "var(--text-3)", lineHeight: 1.6 }}>設定只存於此帳號的瀏覽器資料，會隨 JSON 備份匯出；GitHub 倉庫不會保存你的實際持倉或觀察價。</p>
      <h3 style={{ fontSize: 13, margin: "17px 0 9px" }}>目標範圍</h3>
      {PLAN_CATEGORIES.map((c) => <div key={c.key} style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 9 }}>
        <span style={{ width: 82, flexShrink: 0, fontSize: 12 }}>{c.label}</span>
        <label style={{ flex: 1, minWidth: 0 }}><span style={labelStyle}>下限 %</span><input type="number" min="0" max="100" step="1" inputMode="decimal" style={s.input}
          value={draft.targets[c.key].min} onChange={(e) => setDraft((prev) => ({ ...prev, targets: { ...prev.targets, [c.key]: { ...prev.targets[c.key], min: e.target.value } } }))} /></label>
        <label style={{ flex: 1, minWidth: 0 }}><span style={labelStyle}>上限 %</span><input type="number" min="0" max="100" step="1" inputMode="decimal" style={s.input}
          value={draft.targets[c.key].max} onChange={(e) => setDraft((prev) => ({ ...prev, targets: { ...prev.targets, [c.key]: { ...prev.targets[c.key], max: e.target.value } } }))} /></label>
      </div>)}
      <h3 style={{ fontSize: 13, margin: "17px 0 9px" }}>基金分類與回升觀察價</h3>
      {current.length === 0 ? <p style={{ fontSize: 11.5, color: "var(--text-4)" }}>目前沒有持倉基金。</p> : current.map(([code, h]) => {
        const category = draft.fundCategories[code] || "";
        const known = latestKnownNav(code, priceHistory, navMap);
        return <div key={code} style={{ borderTop: "1px solid var(--border-soft)", padding: "10px 0" }}>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 7 }}>{fundNames[code] || code} <span style={{ color: "var(--text-4)", fontWeight: 400 }}>{code}</span></div>
          <label style={labelStyle}>配置類別</label>
          <select style={s.input} value={category} onChange={(e) => setDraft((prev) => ({ ...prev, fundCategories: { ...prev.fundCategories, [code]: e.target.value } }))}>
            <option value="">請選擇</option>
            {PLAN_CATEGORIES.map((c) => <option key={c.key} value={c.key}>{c.label}</option>)}
            <option value="other">其他（仍計入總市值）</option>
          </select>
          {(category === "hsi" || category === "china") && <label style={{ ...labelStyle, marginTop: 9 }}>
            回升觀察淨值（選填；達標且類別超配時提醒檢視）
            <input type="number" min="0" step="any" inputMode="decimal" style={{ ...s.input, marginTop: 5 }} placeholder="由你決定，不會自動賣出"
              value={draft.recoveryNav[code] ?? ""} onChange={(e) => setDraft((prev) => ({ ...prev, recoveryNav: { ...prev.recoveryNav, [code]: e.target.value } }))} />
            <span style={{ display: "block", marginTop: 4, fontSize: 10.5, color: "var(--text-4)" }}>
              目前已儲存淨值：{known ? fmtNum(known.price, 4) : "—"}；每單位持倉成本約 {h.units > 0 ? fmtNum(h.cost / h.units, 4) : "—"}。請自行核對最新淨值。
            </span>
          </label>}
        </div>;
      })}
      {currencies.length > 0 && <>
        <h3 style={{ fontSize: 13, margin: "17px 0 9px" }}>換算匯率（手動維護）</h3>
        <p style={{ fontSize: 11, color: "var(--text-4)", lineHeight: 1.5 }}>不同幣種不能直接相加；未填匯率時不會顯示整體配置比例。匯率只用於此圖，不改動原始交易紀錄。</p>
        {currencies.map((ccy) => <label key={ccy} style={{ ...labelStyle, marginBottom: 10 }}>
          1 {ccy} = 多少 HKD
          <input type="number" min="0" step="any" inputMode="decimal" style={{ ...s.input, marginTop: 5 }} placeholder="請輸入你採用的匯率"
            value={draft.fxToHKD[ccy] ?? ""} onChange={(e) => setDraft((prev) => ({ ...prev, fxToHKD: { ...prev.fxToHKD, [ccy]: e.target.value } }))} />
        </label>)}
      </>}
      {validation && <p role="alert" style={{ color: "var(--neg)", fontSize: 12 }}>{validation}</p>}
      <div style={s.modalFooter}>
        <button type="button" style={s.cancelBtn} onClick={onClose}>取消</button>
        <button type="button" style={s.saveBtn} onClick={save}>儲存計畫</button>
      </div>
    </div>
  </div>;
}

function FundLedger() {

  const [priceHistory, setPriceHistory] = useState({});

  const [allocationSettingsOpen, setAllocationSettingsOpen] = useState(false);
  const [allocationSnoozedDate, setAllocationSnoozedDate] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [formOpen, setFormOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [activeFund, setActiveFund] = useState("__all__");
  const [activeHouse, setActiveHouse] = useState("__all__");
  const [hideZeroUnits, setHideZeroUnits] = useState(false);
  const [error, setError] = useState("");

  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [pasteDate, setPasteDate] = useState(todayStr());
  const [preview, setPreview] = useState([]);
  const [pasteImportOpen, setPasteImportOpen] = useState(false);
  const [pasteImportText, setPasteImportText] = useState("");

  const fileInputRef = useRef(null);
  const [importPending, setImportPending] = useState(null);

  // New modals
  const [showNameManager, setShowNameManager] = useState(false);
  const [priceModalFund, setPriceModalFund] = useState(null);
  const [chartModalFund, setChartModalFund] = useState(null);
  const [showRealizedModal, setShowRealizedModal] = useState(false);
  const [showFloatingModal, setShowFloatingModal] = useState(false);
  const [showMvModal, setShowMvModal] = useState(false);  // 預估市值明細彈窗
  const [trackFund, setTrackFund] = useState(null);   // 正在設定追蹤的基金代碼
  const [quotes, setQuotes] = useState({});           // 行情快照
  const [quoteState, setQuoteState] = useState("idle"); // idle | loading | ok | error
  const [quoteAt, setQuoteAt] = useState(null);       // 最後更新時間
  const [exportContent, setExportContent] = useState(null);
  const [exportTitle, setExportTitle] = useState("");
  const [copied, setCopied] = useState(false);
  // ---- 帳號系統：預設 Micy（需密碼解鎖），Demo 為展示用假資料帳號 ----
  const [account, setAccount] = useState(lsGet(ACCOUNT_KEY, "Micy"));
  const [unlocked, setUnlocked] = useState([]); // 解鎖狀態僅留存於本次會話，重新整理需重新輸入密碼
  const [passwordVerifier, setPasswordVerifier] = useState(readPasswordVerifier);
  const [pwInput, setPwInput] = useState("");
  const [pwConfirm, setPwConfirm] = useState("");
  const [pwError, setPwError] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [showAccount, setShowAccount] = useState(false);
  // 免密碼帳號（如 Demo 展示帳號）視為永遠已解鎖；其餘帳號需經 unlocked 清單判定
  const isUnlocked =
    unlocked.includes(account) || (ACCOUNTS[account] && ACCOUNTS[account].noPassword);
  useEffect(() => { ACTIVE_ACCOUNT = account; lsSet(ACCOUNT_KEY, account); }, [account]);

  async function tryUnlock(pw) {
    const acc = ACCOUNTS[account];
    if (!acc) { setPwError("未知的帳號"); return; }
    if (account !== "Micy" || pwBusy) return;
    if (!pw) { setPwError("請輸入密碼"); return; }
    if (!passwordVerifier && pw.length < 12) {
      setPwError("新密碼至少需要 12 個字元");
      return;
    }
    if (!passwordVerifier && pw !== pwConfirm) {
      setPwError("兩次輸入的密碼不一致");
      return;
    }
    setPwBusy(true);
    setPwError("");
    try {
      if (!passwordVerifier) {
        const verifier = await createPasswordVerifier(pw);
        localStorage.setItem(PASSWORD_VERIFIER_KEY, JSON.stringify(verifier));
        setPasswordVerifier(verifier);
      } else if (!(await matchesPassword(pw, passwordVerifier))) {
        setPwError("密碼錯誤，請再試一次");
        return;
      }
      setUnlocked((current) => [...new Set([...current, account])]);
      setPwInput("");
      setPwConfirm("");
    } catch (e) {
      setPwError("無法在此瀏覽器設定或驗證密碼；請確認網站資料可儲存。");
    } finally {
      setPwBusy(false);
    }
  }
  function switchAccount(name) {
    setShowAccount(false);
    setAllocationSettingsOpen(false);
    setPwInput(""); setPwConfirm(""); setPwError("");
    setAccount(name);
  }
  const [page, setPage] = useState(1);
  const [activeMonth, setActiveMonth] = useState("__all__");
  const [theme, setTheme] = useState(lsGet("fundLedger_theme", "dark"));
  const TAB_KEY = "fundLedger_activeTab";
  const [activeTab, setActiveTab] = useState(() => {
    const saved = lsGet(TAB_KEY, "overview");
    return saved === "advice" ? "tables" : saved;
  });
  useEffect(() => { lsSet(TAB_KEY, activeTab); }, [activeTab]);
  const GAIN_KEY = "fundLedger_gainMode";
  const [gainMode, setGainMode] = useState(lsGet(GAIN_KEY, "realized"));
  useEffect(() => { lsSet(GAIN_KEY, gainMode); }, [gainMode]);
  const [uploadMenu, setUploadMenu] = useState(false);
  const [downloadMenu, setDownloadMenu] = useState(false);
  const csvInputRef = useRef(null);
  const [backupReminderOpen, setBackupReminderOpen] = useState(false);
  const [versionInfoOpen, setVersionInfoOpen] = useState(false);
  const [notificationPermission, setNotificationPermission] = useState(() =>
    typeof Notification === "undefined" ? "unsupported" : Notification.permission
  );

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    lsSet("fundLedger_theme", theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#F2F6F4" : "#10151C");
  }, [theme]);

  useEffect(() => {
    if (!uploadMenu && !downloadMenu) return;
    const onDoc = (ev) => {
      if (!ev.target.closest || !ev.target.closest(".fl-menu-wrap")) {
        setUploadMenu(false);
        setDownloadMenu(false);
      }
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [uploadMenu, downloadMenu]);
  const PAGE_SIZE = 10;

  // GitHub Pages 是靜態頁面，無法在頁面關閉時排程；因此在每週一、五開啟並解鎖帳本時提醒一次。
  useEffect(() => {
    if (!loaded || !isUnlocked) return;
    const day = new Date().getDay();
    if (day !== 1 && day !== 5) return;
    const today = localTodayStr();
    const reminderStamp = `${APP_VERSION}:${today}`;
    if (lsGet(BACKUP_REMINDER_KEY, "") === reminderStamp) return;
    lsSet(BACKUP_REMINDER_KEY, reminderStamp);
    setBackupReminderOpen(true);
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      try { new Notification("基金帳本備份提醒", { body: "今天是備份日，請下載一份 JSON 備份。" }); } catch (e) {}
    }
  }, [loaded, isUnlocked]);

  async function enableBackupNotifications() {
    if (typeof Notification === "undefined") return;
    try {
      const permission = await Notification.requestPermission();
      setNotificationPermission(permission);
      if (permission === "granted") {
        new Notification("已開啟備份提醒", { body: "每週一、五開啟帳本時會提醒你備份。" });
      }
    } catch (e) {}
  }

  useEffect(() => {
    if (!isUnlocked) return;
    ACTIVE_ACCOUNT = account;
    setLoaded(false);
    (async () => {
      try {
        // 一次性遷移：把舊版（無帳號）的全域資料搬進 Micy 帳號
        if (account === "Micy" && !localStorage.getItem(acctKey(STORAGE_KEY))) {
          const legacy = [
            ["fundLedger_transactions", STORAGE_KEY],
            ["fundLedger_currentNav", NAV_KEY],
            ["fundLedger_fundNames", FUND_NAMES_KEY],
            ["fundLedger_priceHistory", PRICE_HISTORY_KEY],
          ];
          for (const [oldKey, newBase] of legacy) {
            const v = localStorage.getItem(oldKey);
            if (v) localStorage.setItem(acctKey(newBase), v);
          }
        }

        const tRes = await storage.get(STORAGE_KEY);
        const nRes = await storage.get(NAV_KEY);
        const fnRes = await storage.get(FUND_NAMES_KEY);
        const phRes = await storage.get(PRICE_HISTORY_KEY);
        const tkRes = await storage.get(TRACKING_KEY);
        const apRes = await storage.get(ALLOCATION_PLAN_KEY);
        setAllocationPlan(normalizeAllocationPlan(apRes && apRes.value ? JSON.parse(apRes.value) : null));
        setAllocationSnoozedDate(lsGet(acctKey(ALLOCATION_SNOOZE_KEY), ""));
        const txs = tRes && tRes.value ? JSON.parse(tRes.value) : [];

        // Demo 帳號：若尚無資料，以假資料初始化供朋友預覽
        if (account === "Demo" && txs.length === 0) {
          const seed = buildDemoData();
          try {
            localStorage.setItem(acctKey(STORAGE_KEY), JSON.stringify(seed.transactions));
            localStorage.setItem(acctKey(NAV_KEY), JSON.stringify(seed.navMap));
            localStorage.setItem(acctKey(FUND_NAMES_KEY), JSON.stringify(seed.fundNames));
            localStorage.setItem(acctKey(PRICE_HISTORY_KEY), JSON.stringify(seed.priceHistory));
          } catch (e) {}
          setTransactions(seed.transactions);
          setNavMap(seed.navMap);
          setFundNames(seed.fundNames);
          setPriceHistory(seed.priceHistory);
          setTrackingMap(tkRes && tkRes.value ? JSON.parse(tkRes.value) : {});
          setActiveHouse(lsGet(HOUSE_FILTER_KEY, "__all__"));
          setHideZeroUnits(lsGet(HIDE_ZERO_KEY, false));
          setLoaded(true);
          return;
        }

        if (tRes && tRes.value) setTransactions(txs);
        if (nRes && nRes.value) setNavMap(JSON.parse(nRes.value));
        if (fnRes && fnRes.value) setFundNames(JSON.parse(fnRes.value));
        let ph = phRes && phRes.value ? JSON.parse(phRes.value) : {};
        // 將交易中的價格/日期回填進價格紀錄（不覆蓋手動輸入的同一天紀錄）
        for (const t of txs) {
          if (t.nav && t.fundCode && t.date) {
            const hist = ph[t.fundCode] ? [...ph[t.fundCode]] : [];
            if (!hist.some((p) => p.date === t.date)) {
              hist.push({ date: t.date, price: t.nav });
              hist.sort((a, b) => (a.date < b.date ? -1 : 1));
              ph[t.fundCode] = hist;
            }
          }
        }
        setPriceHistory(ph);
        // 追蹤設定：切換帳號時務必重置為空物件，避免殘留上一個帳號的資料
        let tk = tkRes && tkRes.value ? JSON.parse(tkRes.value) : {};
        // 遷移：曾以 MSCI World ETF（usURTH/usACWI，上游無歷史日線）作為追蹤標的的基金，
        // 改以多指數合成籃（GLOBAL_BASKET）呈現走勢，確保能畫出線圖。僅遷移一次。
        const needsMig = Object.values(tk).some(
          (v) => v && (v.targets || []).some((t) => t.code === "usURTH" || t.code === "usACWI")
        );
        if (needsMig) {
          const migrated = {};
          for (const [code, v] of Object.entries(tk)) {
            if (v && (v.targets || []).some((t) => t.code === "usURTH" || t.code === "usACWI")) {
              migrated[code] = {
                mode: "basket",
                stockRatio: v.stockRatio,
                targets: GLOBAL_BASKET.map((x) => ({ ...x })),
                updatedAt: v.updatedAt,
              };
            } else {
              migrated[code] = v;
            }
          }
          tk = migrated;
          persistTracking(tk);
        }
        setTrackingMap(tk);
        setActiveHouse(lsGet(HOUSE_FILTER_KEY, "__all__"));
        setHideZeroUnits(lsGet(HIDE_ZERO_KEY, false));
      } catch (e) {
        setError("讀取資料時發生問題，將從空白帳本開始。");
      } finally {
        setLoaded(true);
      }
    })();
  }, [account, isUnlocked]);

  const persistTransactions = useCallback(async (list) => {
    setTransactions(list);
    try { await storage.set(STORAGE_KEY, JSON.stringify(list)); } catch (e) { setError("儲存失敗，請稍後再試。"); }
  }, []);

  const persistNav = useCallback(async (map) => {
    setNavMap(map);
    try { await storage.set(NAV_KEY, JSON.stringify(map)); } catch (e) { setError("儲存淨值失敗，請稍後再試。"); }
  }, []);

  const persistFundNames = useCallback(async (map) => {
    setFundNames(map);
    try { await storage.set(FUND_NAMES_KEY, JSON.stringify(map)); } catch (e) { setError("儲存基金名稱失敗，請稍後再試。"); }
  }, []);

  const persistPriceHistory = useCallback(async (ph) => {
    setPriceHistory(ph);
    try { await storage.set(PRICE_HISTORY_KEY, JSON.stringify(ph)); } catch (e) { setError("儲存價格紀錄失敗，請稍後再試。"); }
  }, []);

  const persistTracking = useCallback(async (map) => {
    setTrackingMap(map);
    try { await storage.set(TRACKING_KEY, JSON.stringify(map)); } catch (e) { setError("儲存追蹤設定失敗，請稍後再試。"); }
  }, []);

  const persistAllocationPlan = useCallback(async (plan) => {
    const normalized = normalizeAllocationPlan(plan);
    setAllocationPlan(normalized);
    try { await storage.set(ALLOCATION_PLAN_KEY, JSON.stringify(normalized)); } catch (e) { setError("儲存配置計畫失敗，請稍後再試。"); }
    setAllocationSettingsOpen(false);
  }, []);

  const holdings = useMemo(() => computeHoldings(transactions), [transactions]);
  const fundCodes = useMemo(
    () => Object.keys(holdings).sort((a, b) => a.localeCompare(b, "zh-TW")),
    [holdings]
  );

  // All unique houses from holdings
  const allHouses = useMemo(
    () => [...new Set(Object.values(holdings).map((h) => h.house).filter(Boolean))].sort(),
    [holdings]
  );

  // ---- 既有追蹤設定只用於總覽的行情估值 ----
  // 有交易紀錄且「有設定追蹤標的」的基金（含已清倉，方便持續觀察）
  const trackedCodes = useMemo(
    () => Object.keys(holdings)
      .filter((c) => trackingMap[c])
      .sort((a, b) => a.localeCompare(b, "zh-TW")),
    [holdings, trackingMap]
  );
  // 所有需要抓行情的標的代碼（去重）；過濾掉哨兵代碼，避免對其發出無效請求
  const quoteCodes = useMemo(() => {
    const set = new Set();
    trackedCodes.forEach((fc) => {
      (trackingMap[fc].targets || []).forEach((t) => {
        if (t.code && t.code !== GLOBAL_BASKET_CODE) set.add(t.code);
      });
    });
    return [...set].sort();
  }, [trackedCodes, trackingMap]);

  const fetchQuotes = useCallback(async (codes) => {
    if (!codes.length) { setQuoteState("idle"); return; }
    setQuoteState("loading");
    try {
      const r = await fetch(apiUrl("/api/quote?codes=" + encodeURIComponent(codes.join(","))));
      const j = await r.json();
      if (j && j.quotes) {
        setQuotes(j.quotes);
        setQuoteState("ok");
        setQuoteAt(new Date());
      } else { setQuoteState("error"); }
    } catch (e) { setQuoteState("error"); }
  }, []);

  // 總覽與資料表需要同一組即時估值。
  const quoteKey = quoteCodes.join(",");
  useEffect(() => {
    if ((activeTab !== "tables" && activeTab !== "overview") || !quoteKey) return;
    fetchQuotes(quoteKey.split(","));
    // eslint-disable-next-line
  }, [activeTab, quoteKey]);

  // 即時預估淨值（estNav）：對「已綁定追蹤標的 + 抓到行情」的持倉，
  // 用 最新已知淨值 × (1 + 股票倉位% × 標的漲跌%) 推算，作為總覽「預估市值 / 浮動盈虧」的標準。
  const estNavByCode = useMemo(() => {
    const map = {};
    const today = todayStr();
    for (const fc of trackedCodes) {
      const h = holdings[fc];
      if (!h || h.units <= 0) continue;
      const tk = trackingMap[fc];
      const known = latestKnownNav(fc, priceHistory, navMap);
      if (!known) continue;
      const basket = computeBasketChange(tk.targets, quotes);
      const est = estimateFundNav({
        lastNav: known.price,
        lastNavDate: known.date,
        stockRatio: tk.stockRatio,
        basketChangePct: basket ? basket.changePct : (tk.stockRatio === 0 ? 0 : null),
        today,
      });
      if (est) map[fc] = est.estNav;
    }
    return map;
  }, [trackedCodes, trackingMap, holdings, priceHistory, navMap, quotes]);

  // 總覽與明細共用同一組估值：即時估值 > 手填淨值 > 最新價格紀錄。
  const effNavMap = useMemo(() => {
    const map = {};
    for (const code of Object.keys(holdings)) {
      const known = latestKnownNav(code, priceHistory, navMap);
      if (known) map[code] = known.price;
    }
    return { ...map, ...estNavByCode };
  }, [holdings, priceHistory, navMap, estNavByCode]);

  const allocationSnapshot = useMemo(
    () => buildAllocationSnapshot(holdings, effNavMap, allocationPlan),
    [holdings, effNavMap, allocationPlan]
  );

  function snoozeAllocationToday() {
    const today = localTodayStr();
    setAllocationSnoozedDate(today);
    lsSet(acctKey(ALLOCATION_SNOOZE_KEY), today);
  }

  function saveTracking(fundCode, cfg) {
    const next = { ...trackingMap };
    if (cfg === null) delete next[fundCode];
    else next[fundCode] = cfg;
    persistTracking(next);
    setTrackFund(null);
  }

  // Filtered fund codes
  const visibleFundCodes = useMemo(() => {
    let codes = fundCodes;
    if (activeHouse !== "__all__") {
      codes = codes.filter((c) => holdings[c].house === activeHouse);
    }
    if (hideZeroUnits) {
      codes = codes.filter((c) => holdings[c].units > 0);
    } else {
      // 已清倉（單位數 <= 0）的標的排到最後，其餘維持原有順序
      codes = [...codes].sort((a, b) => {
        const za = (holdings[a].units || 0) <= 0 ? 1 : 0;
        const zb = (holdings[b].units || 0) <= 0 ? 1 : 0;
        return za - zb;
      });
    }
    return codes;
  }, [fundCodes, activeHouse, hideZeroUnits, holdings]);

  const visibleTransactions = useMemo(() => {
    let list = transactions;
    if (activeFund !== "__all__") list = list.filter((t) => t.fundCode === activeFund);
    if (activeHouse !== "__all__") list = list.filter((t) => t.house === activeHouse);
    return [...list].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }, [transactions, activeFund, activeHouse]);

  // Month filter options derived from current (un-month-filtered) transactions
  const monthOptions = useMemo(() => {
    const set = new Set();
    for (const t of visibleTransactions) {
      if (t.date && t.date.length >= 7) set.add(t.date.slice(2, 7)); // "26-07"
    }
    return [...set].sort((a, b) => (a < b ? 1 : -1));
  }, [visibleTransactions]);

  const filteredTransactions = useMemo(() => {
    if (activeMonth === "__all__") return visibleTransactions;
    return visibleTransactions.filter((t) => t.date && t.date.slice(2, 7) === activeMonth);
  }, [visibleTransactions, activeMonth]);

  // 逐筆交易盈虧（平均成本法）：賣出盈虧 = 賣出金額 − 賣出時的滾動均價 × 單位數
  const txPnlMap = useMemo(() => {
    const map = {};
    const sorted = [...transactions].sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.type === "buy" && b.type !== "buy") return -1;
      if (b.type === "buy" && a.type !== "buy") return 1;
      return 0;
    });
    const running = {}; // { fundCode: { units, cost } }
    sorted.forEach((t) => {
      if (!running[t.fundCode]) running[t.fundCode] = { units: 0, cost: 0 };
      const r = running[t.fundCode];
      if (t.type === "buy") {
        r.units += t.units || 0;
        r.cost += t.amount || 0;
        map[t.id] = 0;
      } else if (t.type === "sell") {
        const avgCost = r.units > 0 ? r.cost / r.units : 0;
        const sellUnits = t.units || 0;
        const sellAmount = (t.nav != null && sellUnits > 0) ? t.nav * sellUnits : (t.amount || 0);
        map[t.id] = sellAmount - avgCost * sellUnits;
        if (sellUnits > 0 && r.units > 0) {
          const ratio = Math.min(1, sellUnits / r.units);
          r.units -= sellUnits;
          r.cost -= r.cost * ratio;
        }
      } else if (t.type === "dividend") {
        map[t.id] = t.amount || 0;
      } else {
        map[t.id] = 0;
      }
    });
    return map;
  }, [transactions]);

  const totalPages = Math.max(1, Math.ceil(filteredTransactions.length / PAGE_SIZE));
  const safePage = Math.min(Math.max(1, page), totalPages);
  const pageTransactions = filteredTransactions.slice((safePage - 1) * PAGE_SIZE, safePage * PAGE_SIZE);

  // Reset to first page whenever the filter context changes
  useEffect(() => { setPage(1); }, [activeMonth, activeFund, activeHouse]);

  const totalsByCcy = useMemo(() => {
    const map = {};
    for (const code of fundCodes) {
      const h = holdings[code];
      const ccy = h.currency || DEFAULT_CCY;
      if (!map[ccy]) map[ccy] = { cost: 0, marketValue: 0, realized: 0, dividend: 0, unpricedCount: 0 };
      const valuation = valueHolding(h, effNavMap[code]);
      map[ccy].cost += h.cost;
      if (!valuation.missing) map[ccy].marketValue += valuation.marketValue;
      else map[ccy].unpricedCount += 1;
      map[ccy].realized += h.realizedGain;
      map[ccy].dividend += h.dividendTotal;
    }
    return map;
  }, [holdings, fundCodes, effNavMap]);

  function openAdd() { setEditingId(null); setFormOpen(true); }
  function openEdit(t) { setEditingId(t.id); setFormOpen(true); }

  function saveTransaction(data) {
    if (editingId) {
      const old = transactions.find((t) => t.id === editingId);
      if (old && old.nav && old.fundCode && old.date) removePricePoint(old.fundCode, old.date);
      persistTransactions(transactions.map((t) => (t.id === editingId ? { ...data, id: editingId } : t)));
    } else {
      persistTransactions([...transactions, { ...data, id: uid() }]);
    }
    setFormOpen(false);
    setEditingId(null);
    if (data.nav) addPricePoint(data.fundCode, data.date, data.nav);
  }

  function deleteTransaction(id) {
    persistTransactions(transactions.filter((t) => t.id !== id));
    setConfirmDeleteId(null);
    setFormOpen(false);
    setEditingId(null);
  }

  function updateNav(code, val) {
    const nextNav = { ...navMap };
    if (val === "") delete nextNav[code]; else nextNav[code] = val;
    persistNav(nextNav);
    if (val !== "") {
      setPriceHistory((prev) => {
        const hist = prev[code] ? [...prev[code]] : [];
        const d = todayStr();
        const idx = hist.findIndex((p) => p.date === d);
        const rec = { date: d, price: val };
        if (idx >= 0) hist[idx] = rec; else hist.push(rec);
        hist.sort((a, b) => (a.date < b.date ? -1 : 1));
        const merged = { ...prev, [code]: hist };
        try { storage.set(PRICE_HISTORY_KEY, JSON.stringify(merged)); } catch (e) { setError("儲存價格紀錄失敗，請稍後再試。"); }
        return merged;
      });
    }
  }

  function addPricePoint(code, date, price) {
    const p = parseFloat(price);
    if (!code || !date || Number.isNaN(p)) return;
    setPriceHistory((prev) => {
      const hist = prev[code] ? [...prev[code]] : [];
      const idx = hist.findIndex((x) => x.date === date);
      const rec = { date, price: p };
      if (idx >= 0) hist[idx] = rec; else hist.push(rec);
      hist.sort((a, b) => (a.date < b.date ? -1 : 1));
      const merged = { ...prev, [code]: hist };
      try { storage.set(PRICE_HISTORY_KEY, JSON.stringify(merged)); } catch (e) { setError("儲存價格紀錄失敗，請稍後再試。"); }
      return merged;
    });
  }

  function removePricePoint(code, date) {
    if (!code || !date) return;
    setPriceHistory((prev) => {
      const hist = (prev[code] || []).filter((x) => x.date !== date);
      const next = { ...prev };
      if (hist.length === 0) delete next[code]; else next[code] = hist;
      try { storage.set(PRICE_HISTORY_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }

  function downloadFile(content, filename, mime) {
    const trigger = (href) => {
      const a = document.createElement("a");
      a.href = href;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
    try {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      trigger(url);
      // 延遲撤銷：Chrome 下載為非同步，立即撤銷會導致下載被取消
      setTimeout(() => { URL.revokeObjectURL(url); }, 1500);
    } catch (e) {
      // 若 Blob/ObjectURL 被環境限制，改用 data URI 兜底
      trigger("data:" + mime + ";charset=utf-8," + encodeURIComponent(content));
    }
  }

  function exportBackup() {
    const payload = { exportedAt: new Date().toISOString(), version: 5, transactions, navMap, fundNames, priceHistory, trackingMap, allocationPlan };
    const content = JSON.stringify(payload, null, 2);
    downloadFile(content, `基金交易簿備份-${todayStr()}.json`, "application/json");
    showExport(content, "JSON 備份內容（可複製）");
  }

  function exportCsv() {
    const header = ["日期", "機構", "基金代碼", "基金名稱", "類型", "價格", "單位數", "金額", "幣別", "手續費", "參考編號", "備註"];
    const rows = [...transactions].sort((a, b) => (a.date < b.date ? -1 : 1)).map((t) => [
      t.date, t.house || "", t.fundCode, fundNames[t.fundCode] || "",

      t.type === "dividend" ? "" : t.units, t.amount,
      t.currency || DEFAULT_CCY, t.fee || 0, t.refNo || "",
      (t.note || "").replace(/[\n,]/g, " "),
    ]);
    const csv = [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const content = "\uFEFF" + csv;
    downloadFile(content, `基金交易紀錄-${todayStr()}.csv`, "text/csv;charset=utf-8");

    setExportTitle(title);

  function copyExport() {

  function triggerImport() { fileInputRef.current?.click(); }

  function handleImportFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.transactions)) throw new Error("格式不正確");
        setImportPending({ transactions: data.transactions, navMap: data.navMap || {}, fundNames: data.fundNames || {}, priceHistory: data.priceHistory || {}, trackingMap: data.trackingMap || null, allocationPlan: data.allocationPlan || null, fileName: file.name });
      } catch (err) {
        setError("這個備份檔案無法讀取，請確認是先前從此頁面下載的 JSON 備份。");
      }
    };
    reader.readAsText(file);
  }

  function parseCsvRows(text) {
    const t = (text || "").replace(/^﻿/, "");
    const rows = [];
    let row = [], field = "", inQ = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (inQ) {
        if (c === '"') {
          if (t[i + 1] === '"') { field += '"'; i++; } else inQ = false;
        } else field += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && t[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((v) => v.trim() !== ""));
  }

  function parseCsvTransactions(text) {
    const rows = parseCsvRows(text);
    if (rows.length < 2) return [];
    const header = rows[0].map((h) => h.trim());
    const want = { 日期: "date", 機構: "house", 基金代碼: "fundCode", 基金名稱: "fundName", 類型: "type", 價格: "nav", 單位數: "units", 金額: "amount", 幣別: "currency", 手續費: "fee", 參考編號: "refNo", 備註: "note" };
    const idx = {};
    header.forEach((h, i) => { if (want[h]) idx[want[h]] = i; });
    if (idx.date === undefined || idx.fundCode === undefined) return [];
    const labelToType = {};
    Object.entries(TYPE_META).forEach(([k, m]) => { labelToType[m.label] = k; });
    const num = (v) => parseFloat(String(v).replace(/,/g, "")) || 0;
    const out = [];
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const get = (k) => (idx[k] !== undefined ? (row[idx[k]] || "").trim() : "");
      const typeRaw = get("type");
      const type = labelToType[typeRaw] || typeRaw.toLowerCase();
      const fundCode = get("fundCode");
      if (!type || !fundCode) continue;
      const navRaw = get("nav");
      out.push({
        id: uid(),
        house: get("house"),
        fundCode,
        type,
        date: get("date"),
        nav: navRaw ? num(navRaw) : null,
        units: type === "dividend" ? 0 : num(get("units")),
        amount: num(get("amount")),
        fee: num(get("fee")),
        currency: get("currency") || DEFAULT_CCY,
        refNo: get("refNo"),
        note: get("note"),
      });
    }
    return out;
  }

  function handleCsvFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const tx = parseCsvTransactions(reader.result);
        if (!tx.length) throw new Error("無可匯入資料");
        setImportPending({ kind: "csv", transactions: tx, navMap: {}, fundNames: {}, priceHistory: {}, fileName: file.name });
      } catch (err) {
        setError("這個 CSV 檔案無法讀取，請確認是先前從此頁面匯出的 CSV。");
      }
    };
    reader.readAsText(file);
  }

  // 直接貼上「小程序讓複製的文本」：自動判斷 JSON 備份 / CSV / 通知原文
  function importFromPastedText(text) {
    const t = (text || "").replace(/^﻿/, "").trim();
    if (!t) { setError("請先貼上文本再匯入。"); return; }
    // 1) JSON 備份（本頁「下載備份文件」複製出的內容）
    if (t[0] === "{" || t[0] === "[") {
      try {
        const data = JSON.parse(t);
        const tx = Array.isArray(data) ? data : (data.transactions || []);
        if (!Array.isArray(tx)) throw new Error("no transactions");
        setImportPending({
          kind: "backup",
          transactions: tx,
          navMap: data.navMap || {},
          fundNames: data.fundNames || {},
          priceHistory: data.priceHistory || {},
          trackingMap: data.trackingMap || null,
          allocationPlan: data.allocationPlan || null,
          fileName: "貼上的備份文本",
        });
        setPasteImportOpen(false);
        setPasteImportText("");
        return;
      } catch (e) { /* 不是 JSON，往下嘗試 CSV */ }
    }
    // 2) CSV（含本頁匯出的表頭）
    if (t.includes(",") && /日期/.test(t) && /基金代碼/.test(t)) {
      try {
        const tx = parseCsvTransactions(t);
        if (tx.length) {
          setImportPending({ kind: "csv", transactions: tx, navMap: {}, fundNames: {}, priceHistory: {}, fileName: "貼上的 CSV 文本" });
          setPasteImportOpen(false);
          setPasteImportText("");
          return;
        }
      } catch (e) { /* 往下嘗試通知文本 */ }
    }
    // 3) 通知原文：逐行解析，沿用現有「貼上交易紀錄」預覽編輯流程
    setPasteText(t);
    setPasteOpen(true);
    setPasteImportOpen(false);
    setPasteImportText("");
    runParse(t);
  }

  function confirmImport(mode) {
    if (!importPending) return;
    if (mode === "replace") {
      persistTransactions(importPending.transactions);
      persistNav(importPending.navMap);
      persistFundNames(importPending.fundNames);
      if (importPending.priceHistory) persistPriceHistory(importPending.priceHistory);
      if (importPending.trackingMap) persistTracking(importPending.trackingMap);
      persistAllocationPlan(importPending.allocationPlan || defaultAllocationPlan());
    } else {
      const existingIds = new Set(transactions.map((t) => t.id));
      const merged = [...transactions, ...importPending.transactions.filter((t) => !existingIds.has(t.id))];
      persistTransactions(merged);
      persistNav({ ...navMap, ...importPending.navMap });
      persistFundNames({ ...fundNames, ...importPending.fundNames });
      if (importPending.priceHistory) persistPriceHistory({ ...priceHistory, ...importPending.priceHistory });
      if (importPending.trackingMap) persistTracking({ ...trackingMap, ...importPending.trackingMap });
      if (importPending.allocationPlan) {
        const incoming = normalizeAllocationPlan(importPending.allocationPlan);
        persistAllocationPlan({
          targets: incoming.targets,
          fundCategories: { ...allocationPlan.fundCategories, ...incoming.fundCategories },
          recoveryNav: { ...allocationPlan.recoveryNav, ...incoming.recoveryNav },
          fxToHKD: { ...allocationPlan.fxToHKD, ...incoming.fxToHKD },
        });
      }
    }
    // CSV 沒有獨立價格歷史，但成交價可同步進淨值走勢圖（與「貼上交易」一致）
    if (importPending.kind === "csv") {
      const additions = {};
      importPending.transactions.forEach((t) => {
        if (t.nav && t.fundCode && t.date) {
          (additions[t.fundCode] = additions[t.fundCode] || []).push({ date: t.date, price: t.nav });
        }
      });
      setPriceHistory((prev) => {
        const next = mode === "replace" ? {} : { ...prev };
        Object.entries(additions).forEach(([code, recs]) => {
          const hist = next[code] ? [...next[code]] : [];
          recs.forEach((rec) => {
            const i = hist.findIndex((x) => x.date === rec.date);
            if (i >= 0) hist[i] = rec; else hist.push(rec);
          });
          hist.sort((a, b) => (a.date < b.date ? -1 : 1));
          next[code] = hist;
        });
        try { storage.set(PRICE_HISTORY_KEY, JSON.stringify(next)); } catch (e) {}
        return next;
      });
    }
    setImportPending(null);
  }

  function runParse(initialText) {
    const src = (initialText !== undefined ? initialText : pasteText) || "";
    const lines = src.split("\n").map((l) => l.trim()).filter(Boolean);
    const parsed = lines.map((l) => { const r = parseTransactionLine(l); if (r) r.date = pasteDate; return r; }).filter(Boolean);
    setPreview(parsed);
  }

  function updatePreviewRow(tempId, patch) {
    setPreview((prev) => prev.map((r) => {
      if (r.tempId !== tempId) return r;
      const next = { ...r, ...patch };
      const price = parseFloat(next.price);
      const units = parseFloat(next.units);
      if (next.type !== "dividend" && !Number.isNaN(price) && !Number.isNaN(units)) {
        if (patch.price !== undefined || patch.units !== undefined) next.amount = (price * units).toFixed(2);
      }
      next.ok = !!next.fundCode && !!next.type &&
        (next.type === "dividend" ? parseFloat(next.amount) > 0 : parseFloat(next.units) > 0 && parseFloat(next.amount) > 0);
      return next;
    }));
  }

  function removePreviewRow(tempId) { setPreview((prev) => prev.filter((r) => r.tempId !== tempId)); }

  function confirmPreview() {

      currency: r.currency || DEFAULT_CCY, refNo: r.refNo, note: r.note,

    persistTransactions([...transactions, ...newTx]);
    newTx.forEach((t) => { if (t.nav) addPricePoint(t.fundCode, t.date, t.nav); });

            <span style={{...s.th, flex: "0 0 48px"}}>類型</span>
            <span style={{...s.th, flex: "0 0 64px", textAlign: "right"}}>價格</span>
            <span style={{...s.th, flex: "0 0 66px", textAlign: "right"}}>單位數</span>
            <span style={{...s.th, flex: "1 1 96px", textAlign: "right"}}>金額</span>
            <span style={{...s.th, flex: "0 0 80px", textAlign: "right"}}>盈虧</span>
            <span style={{...s.th, flex: "0 0 40px"}} />
          </div>

          {filteredTransactions.length === 0 ? (
            <div style={s.emptyState}>
              <p style={{ margin: 0, fontFamily: "'Noto Serif TC', serif", fontSize: 15, color: "var(--text-3)" }}>
                {visibleTransactions.length === 0 ? "帳本目前是空的" : "沒有符合篩選條件的交易"}
              </p>
              {visibleTransactions.length === 0 && (
                <p style={{ margin: "6px 0 14px", fontSize: 12.5, color: "var(--text-4)" }}>
                  點右上角「貼上文本匯入」或「手動新增」，記下第一筆認購或贖回。
                </p>
              )}
            </div>
          ) : (
            pageTransactions.map((t) => {
              const meta = TYPE_META[t.type] || { label: t.type, color: "var(--text-3)" };
              return (
                <div key={t.id} style={s.row} className="fl-row fl-fade">
                  <span style={{...s.td, flex: "0 0 82px", color: "var(--text-3)"}}>{t.date}</span>
                  <span style={{...s.td, flex: "0 0 92px"}}>
                    <div style={{ fontWeight: 500 }}>{t.fundCode}</div>
                    {fundNames[t.fundCode] && <div style={{ fontSize: 10.5, color: "var(--text-4)" }}>{fundNames[t.fundCode]}</div>}
                  </span>
                  <span style={{...s.typeBadge, color: meta.color, borderColor: meta.color + "55"}}>{meta.label}</span>
                  <span style={{...s.td, ...s.mono, flex: "0 0 64px", textAlign: "right"}}>
                    {t.nav ? fmtNum(t.nav, 4) : "—"}
                  </span>
                  <span style={{...s.td, ...s.mono, flex: "0 0 66px", textAlign: "right"}}>
                    {t.type === "dividend" ? "—" : fmtNum(t.units, 3)}
                  </span>
                  <span style={{...s.td, ...s.mono, flex: "1 1 96px", textAlign: "right", fontWeight: 600, whiteSpace: "nowrap",
                    color: t.type === "buy" ? NEG_COLOR : t.type === "sell" ? POS_COLOR : "var(--text)" }}>
                    {fmtMoney(t.amount, t.currency)}
                  </span>
                  {(() => {
                    const pnl = txPnlMap[t.id];
                    if (t.type === "buy" || pnl === undefined) return <span style={{...s.td, ...s.mono, flex: "0 0 80px", textAlign: "right", color: "var(--text-faint)"}}>—</span>;
                    const pnlColor = pnl >= 0 ? POS_COLOR : NEG_COLOR;
                    return <span style={{...s.td, ...s.mono, flex: "0 0 80px", textAlign: "right", fontWeight: 600, color: pnlColor}}>{fmtSignedMoney(pnl, t.currency)}</span>;
                  })()}
                  <span style={{ flex: "0 0 40px", display: "flex", justifyContent: "flex-end" }}>
                    <button style={s.iconBtn} onClick={() => openEdit(t)} title="編輯"><Pencil size={13} /></button>
                  </span>
                  {(t.refNo || t.note) && (
                    <div style={s.noteLine}>
                      {t.refNo && <span style={s.mono}>#{t.refNo}</span>}
                      {t.refNo && t.note && t.note !== t.raw ? "　" : ""}
                      {t.note && t.note !== t.refNo ? t.note : ""}
                    </div>
                  )}
                </div>
              );
            })
          )}
          {totalPages > 1 && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, padding: "12px 14px", borderTop: "1px solid var(--border-soft)" }}>
              <button type="button" onClick={() => setPage((p) => Math.max(1, p - 1))}
                disabled={safePage <= 1}
                style={{...s.pagerBtn, opacity: safePage <= 1 ? 0.4 : 1}}>上一頁</button>
              <span style={{ fontSize: 12.5, color: "var(--text-2)", fontFamily: "'JetBrains Mono', monospace" }}>
                第 {safePage} / {totalPages} 頁
              </span>
              <button type="button" onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                disabled={safePage >= totalPages}
                style={{...s.pagerBtn, opacity: safePage >= totalPages ? 0.4 : 1}}>下一頁</button>
            </div>
          )}
        </section>
          </>
        )}
        {activeTab === "calendar" && (
          <>
            <div style={{...s.sectionTitle, marginBottom: 16}}><span style={s.sectionBar} />收益日曆</div>
            {/* 預估 / 已實現 切換 */}
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              <button className="fl-chip" style={{...s.chip, ...(gainMode === "realized" ? s.chipActive : {})}}
                onClick={() => setGainMode("realized")}>已實現收益</button>
              <button className="fl-chip" style={{...s.chip, ...(gainMode === "estimated" ? s.chipActive : {})}}
                onClick={() => setGainMode("estimated")}>預估收益</button>
            </div>
            <CalendarGrid transactions={transactions} fundNames={fundNames} holdings={holdings} navMap={navMap} priceHistory={priceHistory} gainMode={gainMode} s={s} />
          </>
        )}
        {activeTab === "tables" && (
          <LedgerTables transactions={transactions} holdings={holdings} fundNames={fundNames}
            navMap={navMap} priceHistory={priceHistory} effectiveNavMap={effNavMap}
            estimatedNavMap={estNavByCode} trackingMap={trackingMap} onTracking={setTrackFund}
            quoteState={quoteState} quoteAt={quoteAt} onRefresh={() => fetchQuotes(quoteCodes)}
            canRefresh={quoteCodes.length > 0} />
        )}
      </div>

      {/* 底部 Tab 導航 */}
      <nav style={s.tabBar}>
        <div style={{ display: "flex", width: "100%", maxWidth: 920, padding: "0 8px", minWidth: 0 }}>
        <button className={"fl-tab" + (activeTab === "overview" ? " active" : "")} onClick={() => setActiveTab("overview")}>
          <Wallet size={20} /> <span>資產總覽</span>
        </button>
        <button className={"fl-tab" + (activeTab === "calendar" ? " active" : "")} onClick={() => setActiveTab("calendar")}>
          <Calendar size={20} /> <span>收益日曆</span>
        </button>
        <button className={"fl-tab" + (activeTab === "tables" ? " active" : "")} onClick={() => setActiveTab("tables")}>
          <ListOrdered size={20} /> <span>資料表</span>
        </button>
        </div>
      </nav>

      {formOpen && (
        <TransactionForm initial={editingRecord} fundCodes={fundCodes}
          onCancel={() => { setFormOpen(false); setEditingId(null); }}
          onSave={saveTransaction}
          onDelete={(id) => deleteTransaction(id)} />
      )}

      {importPending && (
        <div style={s.modalBackdrop} onClick={() => setImportPending(null)}>
          <div style={{...s.modal, maxWidth: 420}} onClick={(e) => e.stopPropagation()}>
            <div style={s.modalHeader}>
              <h2 style={s.modalTitle}>{importPending.kind === "csv" ? "匯入 CSV" : "還原備份"}</h2>
              <button type="button" style={s.closeBtn} onClick={() => setImportPending(null)}><X size={18} /></button>
            </div>
            <p style={{ fontSize: 13, color: "var(--text-2)", lineHeight: 1.7 }}>
              {importPending.kind === "csv"
                ? <>CSV 檔「{importPending.fileName}」可匯入 {importPending.transactions.length} 筆交易紀錄。<br />目前帳本已有 {transactions.length} 筆紀錄，要如何處理？</>
                : <>備份檔「{importPending.fileName}」內含 {importPending.transactions.length} 筆交易紀錄。<br />目前帳本已有 {transactions.length} 筆紀錄，要如何處理？{importPending.allocationPlan && <>備份內的配置目標、分類及觀察價也會一併還原。</>}</>}
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
              <button type="button" style={{...s.saveBtn, width: "100%"}} className="fl-btn" onClick={() => confirmImport("merge")}>
                合併（保留目前資料，加入備份中沒有的紀錄）
              </button>
              <button type="button" style={{...s.cancelBtn, width: "100%", color: "var(--neg)", borderColor: "var(--neg-55)"}}
                onClick={() => confirmImport("replace")}>
                取代（清空目前資料，改用備份內容）
              </button>
              <button type="button" style={{...s.cancelBtn, width: "100%"}} onClick={() => setImportPending(null)}>取消</button>
            </div>
          </div>
        </div>
      )}

      {showNameManager && (
        <FundNameModal holdings={holdings} fundNames={fundNames}
          onSave={persistFundNames}
          onClose={() => setShowNameManager(false)} />
      )}

      {priceModalFund && (
        <PriceHistoryModal fundCode={priceModalFund}
          fundName={fundNames[priceModalFund] || ""}
          priceHistory={priceHistory}
          onSave={persistPriceHistory}
          onClose={() => setPriceModalFund(null)} />
      )}

      {chartModalFund && (
        <NavChart fundCode={chartModalFund}
          fundName={fundNames[chartModalFund] || ""}
          transactions={transactions}
          priceHistory={priceHistory}
          avgCost={chartAvgCost}
          currency={holdings[chartModalFund]?.currency || DEFAULT_CCY}
          onClose={() => setChartModalFund(null)} />
      )}

      {showRealizedModal && (
        <RealizedGainModal transactions={transactions} fundNames={fundNames} holdings={holdings}
          onClose={() => setShowRealizedModal(false)} />
      )}

      {showFloatingModal && (
        <FloatingGainModal holdings={holdings} priceHistory={priceHistory} navMap={effNavMap}
          fundNames={fundNames} onClose={() => setShowFloatingModal(false)} />
      )}

      {showMvModal && (
        <MarketValueModal holdings={holdings} navMap={effNavMap} fundNames={fundNames}
          totalsByCcy={totalsByCcy} onClose={() => setShowMvModal(false)} />
      )}

      {trackFund && (
        <TrackingSetupModal fundCode={trackFund}
          fundName={fundNames[trackFund] || ""}
          tracking={trackingMap[trackFund] || null}
          onSave={saveTracking}
          onClose={() => setTrackFund(null)} />
      )}

      {allocationSettingsOpen && (
        <AllocationSettingsModal plan={allocationPlan} holdings={holdings} fundNames={fundNames}
          navMap={navMap} priceHistory={priceHistory} onSave={persistAllocationPlan}
          onClose={() => setAllocationSettingsOpen(false)} />
      )}

      {pasteImportOpen && (
        <div style={s.modalBackdrop} onClick={() => setPasteImportOpen(false)}>
          <div style={{...s.modal, maxWidth: 560}} onClick={(e) => e.stopPropagation()}>
            <div style={s.modalHeader}>
              <h2 style={s.modalTitle}>貼上文本匯入</h2>
              <button type="button" style={s.closeBtn} onClick={() => setPasteImportOpen(false)}><X size={18} /></button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-3)", lineHeight: 1.7, margin: "0 0 10px" }}>
              直接貼上：①本頁「下載」裡<b style={{ color: "var(--text-2)" }}>複製到剪貼簿</b>的<b style={{ color: "var(--text-2)" }}>備份 JSON</b> 或 <b style={{ color: "var(--text-2)" }}>CSV</b> 文本；②銀行 / 基金通知原文。系統會自動判斷格式並匯入。
            </p>
            <textarea value={pasteImportText}
              onChange={(e) => setPasteImportText(e.target.value)}
              placeholder="在此貼上要匯入的文本…"
              style={{ width: "100%", height: "34vh", background: "var(--inset)", border: "1px solid var(--border)", borderRadius: 4, color: "var(--text-2)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, padding: "10px 12px", lineHeight: 1.5, resize: "none" }} />
            <div style={s.modalFooter}>
              <button type="button" style={{...s.saveBtn, opacity: pasteImportText.trim() ? 1 : 0.5}} className="fl-btn"
                onClick={() => importFromPastedText(pasteImportText)} disabled={!pasteImportText.trim()}>匯入</button>
              <button type="button" style={s.cancelBtn} onClick={() => setPasteImportOpen(false)}>取消</button>
            </div>
          </div>
        </div>
      )}

      {exportContent !== null && (
        <div style={s.modalBackdrop} onClick={closeExport}>
          <div style={{...s.modal, maxWidth: 560}} onClick={(e) => e.stopPropagation()}>
            <div style={s.modalHeader}>
              <h2 style={s.modalTitle}>{exportTitle}</h2>
              <button type="button" style={s.closeBtn} onClick={closeExport}><X size={18} /></button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-3)", lineHeight: 1.7, margin: "0 0 10px" }}>
              微信小程式環境無法直接下載檔案。請「複製」下方內容，或<b style={{ color: "var(--text-2)" }}>長按文字選取後複製</b>，
              貼到微信「檔案傳輸助手」或手機備忘錄，回到電腦上開啟即可。
            </p>
            <textarea id="export-textarea" readOnly value={exportContent}
              style={{ width: "100%", height: "46vh", background: "var(--inset)", border: "1px solid var(--border)", borderRadius: 4, color: "var(--text-2)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, padding: "10px 12px", lineHeight: 1.5, resize: "none" }} />
            <div style={s.modalFooter}>
              <button type="button" style={{...s.saveBtn, opacity: copied ? 0.6 : 1}} className="fl-btn"
                onClick={copyExport}>{copied ? "已複製 ✓" : "複製到剪貼簿"}</button>
              <button type="button" style={s.cancelBtn} onClick={closeExport}>關閉</button>
            </div>
          </div>
        </div>
      )}

      {showAccount && (
        <div style={s.modalBackdrop} onClick={() => setShowAccount(false)}>
          <div style={{...s.modal, maxWidth: 460}} onClick={(e) => e.stopPropagation()}>
            <div style={s.modalHeader}>
              <h2 style={s.modalTitle}>切換帳號</h2>
              <button type="button" style={s.closeBtn} onClick={() => setShowAccount(false)}><X size={18} /></button>
            </div>
            <p style={{ fontSize: 12, color: "var(--text-3)", lineHeight: 1.7, margin: "0 0 14px" }}>
              目前帳號：<b style={{ color: "var(--text-2)" }}>{ACCOUNTS[account] ? ACCOUNTS[account].label : account}</b>。選擇其他帳號後，若尚未解鎖會回到解鎖畫面。
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {Object.keys(ACCOUNTS).map((name) => {
                const a = ACCOUNTS[name];
                const unlockedAcc = unlocked.includes(name);
                const isCurrent = name === account;
                return (
                  <button key={name} type="button"
                    onClick={() => switchAccount(name)}
                    style={{ ...s.acctRow, ...(isCurrent ? { borderColor: "var(--accent)", background: "var(--inset)" } : {}) }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={s.acctAvatar}>{a.label[0]}</div>
                      <div style={{ textAlign: "left" }}>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>{a.label}{isCurrent && <span style={{ fontSize: 11, color: "var(--accent)", marginLeft: 6 }}>（目前）</span>}</div>
                        <div style={{ fontSize: 11, color: "var(--text-4)" }}>{a.owner ? "私人帳本 · 需密碼" : "展示帳號 · 範例資料"}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, color: unlockedAcc ? "var(--pos)" : "var(--text-4)", fontSize: 12 }}>
                      {a.noPassword ? "免密碼" : unlockedAcc ? "已解鎖" : <><Lock size={13} /> 需密碼</>}
                      <ChevronRight size={16} />
                    </div>
                  </button>
                );
              })}
            </div>
            <div style={s.modalFooter}>
              <button type="button" style={s.cancelBtn} onClick={() => setShowAccount(false)}>關閉</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  },

    fontFamily: "'Noto Sans TC', sans-serif", transition: "border-color 0.15s",
  },

  },
  parseActions: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, flexWrap: "wrap", gap: 8 },
  parseHint: { fontSize: 11, color: "var(--text-4)" },
  parseBtn: { background: "var(--border)", color: "var(--text)", border: "1px solid var(--border-strong)", borderRadius: "var(--r-sm)", padding: "8px 16px", fontSize: 12.5, cursor: "pointer" },
  previewWrap: { marginTop: 14, display: "flex", flexDirection: "column", gap: 8 },
  previewRow: { display: "flex", alignItems: "flex-start", gap: 8, border: "1px solid", borderRadius: "var(--r-sm)", padding: "8px 10px", background: "var(--inset)" },
  previewStatus: { flexShrink: 0, marginTop: 6 },

  previewInput: { background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--r-sm)", color: "var(--text)", fontSize: 11.5, padding: "5px 7px", width: "100%" },
  previewRemove: { flexShrink: 0, background: "transparent", border: "none", color: "var(--text-4)", cursor: "pointer", padding: 4 },
  previewFooter: { display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 4 },
  passbook: { display: "flex", flexWrap: "wrap", background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--r-lg)", padding: "16px 4px", marginBottom: 12, boxShadow: "var(--shadow-card)" },
  passbookStub: { flex: "1 1 140px", display: "flex", flexDirection: "column", gap: 6, padding: "4px 18px", minWidth: 130 },
  passbookDivider: { width: 1, background: "repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 4px, transparent 4px, transparent 9px)", margin: "2px 0" },
  stubLabel: { fontSize: 10.5, color: "var(--text-3)", letterSpacing: "0.03em" },
  stubValueMono: { fontFamily: "'JetBrains Mono', monospace", fontSize: 16.5, fontWeight: 600, fontVariantNumeric: "tabular-nums" },
  fundGrid: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 10, marginTop: 8, marginBottom: 18 },
  fundCard: { background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--r-md)", padding: "12px 14px", transition: "border-color 0.15s", boxShadow: "var(--shadow-card)" },
  fundCardTop: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8, gap: 8 },
  fundName: { fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, fontSize: 14 },
  fundUnits: { fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "var(--text-3)", flexShrink: 0 },
