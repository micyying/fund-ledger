// Raw-text parser

function parseTransactionLine(rawLine) {
  const raw = rawLine.trim();
  const result = {
    tempId: uid(),
    raw,
    house: "",
    fundCode: "",
    type: "",
    date: todayStr(),
    price: "",
    units: "",
    currency: DEFAULT_CCY,
    amount: "",
    fee: "",
    refNo: "",
    note: raw,
  };
  if (!raw) return null;

  let main = raw;
  const lastPeriod = Math.max(raw.lastIndexOf("。"), raw.lastIndexOf("."));
  if (lastPeriod !== -1) {
    const tail = raw.slice(lastPeriod + 1).trim();
    if (/^[A-Za-z]{1,4}\d{3,8}$/.test(tail)) {
      result.refNo = tail;
      main = raw.slice(0, lastPeriod);
    }
  }

  const houseMatch = main.match(/^([^\s:：]{1,12})[:：]/);
  let body = main;
  if (houseMatch) {
    result.house = houseMatch[1];
    body = main.slice(houseMatch[0].length);
  }

  if (/認購|申購/.test(body)) result.type = "buy";
  else if (/贖回/.test(body)) result.type = "sell";
  else if (/派息|分派|股息/.test(body)) result.type = "dividend";

  const unitsMatch = body.match(/([\d,]+\.?\d*)\s*單位/);
  if (unitsMatch) result.units = unitsMatch[1].replace(/,/g, "");

  const codeMatch = body.match(/單位\s*\(?\s*([A-Za-z]{1,4}\d{3,8})\s*\)?/);
  if (codeMatch) result.fundCode = codeMatch[1];
  else {
    const parenCode = body.match(/\(([A-Za-z]{1,4}\d{3,8})\)/);
    if (parenCode) result.fundCode = parenCode[1];
  }

  const priceMatch = body.match(
    /(?:成交價|贖回價|認購價|申購價|淨值|金額)[:\s]*([A-Za-z]{2,3})?\s*([\d,]+\.?\d*)/
  );
  if (priceMatch) {
    if (priceMatch[1]) result.currency = priceMatch[1].toUpperCase();
    const num = priceMatch[2].replace(/,/g, "");
    if (result.type === "dividend") result.amount = num;
    else result.price = num;
  }

  if (result.type !== "dividend" && result.price && result.units) {
    result.amount = (parseFloat(result.price) * parseFloat(result.units)).toFixed(2);
  }

  result.ok =
    !!result.fundCode &&
    !!result.type &&
    (result.type === "dividend"
      ? parseFloat(result.amount) > 0
      : parseFloat(result.units) > 0 && parseFloat(result.amount) > 0);

  return result;
}

function computeHoldings(transactions) {
  const byFund = {};
  const sorted = [...transactions].sort((a, b) =>
    a.date === b.date ? 0 : a.date < b.date ? -1 : 1
  );
  for (const t of sorted) {
    if (!byFund[t.fundCode]) {
      byFund[t.fundCode] = {
        house: t.house,
        currency: t.currency || DEFAULT_CCY,
        units: 0,
        cost: 0,
        buyTotal: 0,
        sellTotal: 0,
        dividendTotal: 0,
        realizedGain: 0,
        feeTotal: 0,
      };
    }
    const h = byFund[t.fundCode];
    if (t.house) h.house = t.house;
    if (t.currency) h.currency = t.currency;
    const fee = t.fee || 0;
    h.feeTotal += fee;
    if (t.type === "buy") {
      h.units += t.units;
      h.cost += t.amount + fee;
      h.buyTotal += t.amount;
    } else if (t.type === "sell") {
      const avgCost = h.units > 0 ? h.cost / h.units : 0;
      const costRemoved = avgCost * t.units;
      h.realizedGain += t.amount - fee - costRemoved;
      h.units -= t.units;
      h.cost -= costRemoved;
      h.sellTotal += t.amount;
      if (h.units < 1e-6) {
        h.units = 0;
        h.cost = 0;
      }
    } else if (t.type === "dividend") {
      h.dividendTotal += t.amount;
    }
  }
  return byFund;
}

function computeRealizedGains(transactions, fundNames) {
  const results = [];
  const sorted = [...transactions].sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const fundState = {};
  for (const t of sorted) {
    if (!fundState[t.fundCode]) fundState[t.fundCode] = { units: 0, cost: 0 };
    const fs = fundState[t.fundCode];
    const fee = t.fee || 0;
    if (t.type === 'buy') {
      fs.units += t.units;
      fs.cost += t.amount + fee;
    } else if (t.type === 'sell') {
      const avgCost = fs.units > 0 ? fs.cost / fs.units : 0;
      const costRemoved = avgCost * t.units;
      results.push({
        date: t.date, fundCode: t.fundCode, fundName: fundNames[t.fundCode] || '',
        sellAmount: t.amount, units: t.units, avgPrice: t.units > 0 ? t.amount / t.units : 0,
        costRemoved, fee, gain: t.amount - fee - costRemoved, currency: t.currency || 'HKD'
      });
      fs.units -= t.units;
      fs.cost -= costRemoved;
    }
  }
  return results;
}

// ---------------------------------------------------------------------------
// 每日浮動盈虧（預估收益日曆）
// ---------------------------------------------------------------------------
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d + n);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}
function diffDays(a, b) {
  const [ay, am, ad] = a.split("-").map(Number), [by, bm, bd] = b.split("-").map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}

// 建立每檔基金的升序價格序列；navMap 較新時補一個「今日」價格點
function buildPriceSeries(priceHistory, navMap, today) {
  const series = {};
  const codes = new Set([...Object.keys(priceHistory || {}), ...Object.keys(navMap || {})]);
  for (const code of codes) {
    const arr = ((priceHistory && priceHistory[code]) || [])
      .filter((p) => p && p.date && Number.isFinite(Number(p.price)) && Number(p.price) > 0)
      .map((p) => ({ date: p.date, price: Number(p.price) }))
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    // ★ navMap[code] 是 number（不是 {price} 物件），用 Number() 強制轉型
    const navNow = navMap ? Number(navMap[code]) : NaN;
    if (Number.isFinite(navNow) && navNow > 0) {
      const last = arr[arr.length - 1];
      if (!last || last.date < today) arr.push({ date: today, price: navNow });
      else if (last.date === today) last.price = navNow;
    }
    if (arr.length) series[code] = arr;
  }
  return series;
}

function computeDailyFloatingSeries(transactions, priceHistory, navMap, today) {
  const out = { byDate: {}, dates: [] };
  const txs = (transactions || []).filter((t) => t && t.date)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  if (txs.length === 0) return out;

  const series = buildPriceSeries(priceHistory, navMap, today);
  const state = {};    // code -> { units, cost, ccy }
  const cursor = {};   // code -> series index（單調遞增）
  let ti = 0;

  const firstDate = txs[0].date;
  const lastDate = today < firstDate ? firstDate : today;
  let day = firstDate, guard = 0;

  while (day <= lastDate && guard++ < 20000) {
    // (1) 重現當日收盤持倉 — 處理所有 date <= day 的未處理交易
    while (ti < txs.length && txs[ti].date <= day) {
      const t = txs[ti++];
      const st = state[t.fundCode] || (state[t.fundCode] = { units: 0, cost: 0, ccy: t.currency || DEFAULT_CCY });
      if (t.currency) st.ccy = t.currency;
      const fee = t.fee || 0;
      if (t.type === "buy") {
        st.units += t.units || 0;
        st.cost += (t.amount || 0) + fee;
      } else if (t.type === "sell") {
        const avgCost = st.units > 0 ? st.cost / st.units : 0;
        const costRemoved = avgCost * (t.units || 0);
        st.units -= t.units || 0;
        st.cost -= costRemoved;
        if (st.units < 1e-6) { st.units = 0; st.cost = 0; }
      }
      // dividend 不影響持倉
    }
    // (2) 逐檔估值
    const items = [], byCcy = {};
    for (const code of Object.keys(state)) {
      const st = state[code];
      if (st.units <= 1e-9) continue;
      const arr = series[code];
      if (!arr) continue;
      let i = cursor[code] === undefined ? -1 : cursor[code];
      while (i + 1 < arr.length && arr[i + 1].date <= day) i++;
      cursor[code] = i;
      if (i < 0) continue;                       // 該日之前尚無報價
      const price = arr[i].price, priceDate = arr[i].date;
      const mv = price * st.units, gain = mv - st.cost;
      const ccy = st.ccy || DEFAULT_CCY;
      if (!byCcy[ccy]) byCcy[ccy] = { gain: 0, mv: 0, cost: 0 };
      byCcy[ccy].gain += gain; byCcy[ccy].mv += mv; byCcy[ccy].cost += st.cost;
      items.push({ fundCode: code, units: st.units, cost: st.cost, price, priceDate,
                   staleDays: diffDays(priceDate, day), mv, gain, currency: ccy });
    }
    if (items.length) {
      items.sort((a, b) => Math.abs(b.gain) - Math.abs(a.gain));
      const mainCcy = Object.keys(byCcy).sort((a, b) => byCcy[b].cost - byCcy[a].cost)[0];
      out.byDate[day] = { date: day, items, byCcy, mainCcy,
                          multiCcy: Object.keys(byCcy).length > 1, total: byCcy[mainCcy].gain };
      out.dates.push(day);
    }
    day = addDays(day, 1);
  }
  // (3) 補當日變動 delta
  for (let k = 0; k < out.dates.length; k++) {
    const cur = out.byDate[out.dates[k]];
    const prev = k > 0 ? out.byDate[out.dates[k - 1]] : null;
    cur.delta = prev && prev.byCcy[cur.mainCcy] ? cur.total - prev.byCcy[cur.mainCcy].gain : null;
  }
  return out;
}

// 圖二格式：+29.76 / -372.10
function fmtSigned(n, digits) {
  digits = digits || 2;
  if (n === null || n === undefined || Number.isNaN(n)) return "0.00";
  const abs = Math.abs(n);
  const body = abs >= 100000
    ? (abs / 1000).toFixed(1) + "k"
    : abs.toLocaleString("zh-TW", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return (n < 0 ? "-" : "+") + body;
}

// 各基金「當前浮動盈虧」排行榜資料（最新淨值 × 持倉 − 持倉成本）
function computeFloatingGains(holdings, priceHistory, navMap, todayVal, fundNames) {
  const series = buildPriceSeries(priceHistory, navMap, todayVal);
  const out = [];
  for (const code of Object.keys(holdings)) {
    const h = holdings[code];
    if (!h || h.units <= 0) continue;
    const arr = series[code];
    if (!arr || arr.length === 0) continue;
    const last = arr[arr.length - 1]; // 已含今日 nav 補點，故為最新價
    const price = last.price;
    const cost = h.cost || 0;
    const units = h.units;
    const mv = price * units;
    const gain = mv - cost;
    out.push({
      fundCode: code,
      fundName: fundNames ? fundNames[code] : "",
      gain, cost, mv, price, units,
      currency: h.currency || DEFAULT_CCY,
    });
  }
  out.sort((a, b) => b.gain - a.gain);
  return out;
}

// 主要指數加權合成，既能估算每日漲跌，也能畫出近 6 個月走勢。權重為粗略的全球股市配比。
const GLOBAL_BASKET = [
  { code: "usINX",    name: "標普 500",   weight: 55 },
  { code: "hkHSI",    name: "恒生指數",   weight: 18 },
  { code: "sh000300", name: "滬深 300",   weight: 15 },
  { code: "usIXIC",   name: "納斯達克",   weight: 12 },
];
const GLOBAL_BASKET_CODE = "__global__"; // 在設定介面中代表「全球股票（近似）」

// 依基金名稱關鍵詞推薦追蹤標的與預設股票倉位
// 順序重要：越specific的規則越靠前
const FUND_GUESS_RULES = [
  { kw: ["貨幣", "货币", "現金", "现金"],                    code: null,       ratio: 0  },
  { kw: ["債券", "债券", "企業債", "企业债", "國債", "国债"], code: null,       ratio: 0  },
  { kw: ["恒生科技", "恆生科技", "科技ETF"],                 code: "hkHSTECH", ratio: 95 },
  { kw: ["國企", "国企", "中國企業", "中国企业", "H股"],      code: "hkHSCEI",  ratio: 95 },
  { kw: ["新經濟", "新经济"],                                code: "hkHSTECH", ratio: 95 },
  { kw: ["恒生指數", "恆生指數", "恒生指数", "恒指"],         code: "hkHSI",    ratio: 95 },
  { kw: ["標普", "标普", "S&P", "500"],                      code: "usINX",    ratio: 95 },
  { kw: ["納斯達克", "纳斯达克", "納指", "NASDAQ"],           code: "usIXIC",   ratio: 95 },
  { kw: ["道瓊", "道琼"],                                    code: "usDJI",    ratio: 95 },
  { kw: ["美國", "美国", "摩根美國", "美股"],                 code: "usINX",    ratio: 95 },
  { kw: ["環球股票", "環球股票指數", "世界指數", "世界股票", "全球股票", "MSCI世界", "環球"], code: GLOBAL_BASKET_CODE, ratio: 95 },
  { kw: ["滬深300", "沪深300"],                              code: "sh000300", ratio: 95 },
  { kw: ["創業板", "创业板"],                                code: "sz399006", ratio: 95 },
  { kw: ["上證", "上证"],                                    code: "sh000001", ratio: 95 },
  { kw: ["恒生", "恆生"],                                    code: "hkHSI",    ratio: 95 },
];

// 依基金名稱猜測追蹤設定，回 {code, name, ratio, matched}
function guessIndexForFund(fundName) {
  const n = String(fundName || "");
  if (!n) return null;
  for (const rule of FUND_GUESS_RULES) {
    if (!rule.kw.some((k) => n.includes(k))) continue;
    if (rule.code === null) {
      // 債券/貨幣類：股票倉位 0，淨值幾乎不隨股市波動
      return { code: null, name: "", ratio: rule.ratio, matched: true };
    }
    const preset = INDEX_PRESETS.find((p) => p.code === rule.code);
    let name = preset ? preset.name : rule.code;
    if (rule.code === GLOBAL_BASKET_CODE) name = "全球股票（多市場近似）";
    return { code: rule.code, name, ratio: rule.ratio, matched: true };
  }
  return null;
}

// 依權重加權求組合漲跌%。權重和不足 100 時按實際權重歸一化，
// 避免只錄了前十大持倉（合計約 50%）就把漲跌幅算小一半。
function computeBasketChange(targets, quotes) {
  if (!Array.isArray(targets) || targets.length === 0) return null;
  let wSum = 0, acc = 0, hit = 0, miss = 0;
  for (const t of targets) {
    const q = quotes && quotes[t.code];
    const w = Number(t.weight);
    if (!isFinite(w) || w <= 0) continue;
    if (!q || !isFinite(q.changePct)) { miss++; continue; }
    acc += q.changePct * w;
    wSum += w;
    hit++;
  }
  if (wSum <= 0) return null;
  return { changePct: acc / wSum, hit, miss, weightSum: wSum };
}


// 取得某基金最新已知淨值與其日期
function latestKnownNav(fundCode, priceHistory, navMap) {
  const manual = navMap ? Number(navMap[fundCode]) : NaN;
  const hist = (priceHistory && priceHistory[fundCode]) || [];
  let best = null;
  for (const p of hist) {
    const v = Number(p.price);
    if (!isFinite(v) || v <= 0) continue;
    if (!best || p.date > best.date) best = { date: p.date, price: v };
  }
  // 手動輸入的當前淨值視為最新（使用者剛從銀行 App 抄下來的）
  if (isFinite(manual) && manual > 0) {
    return { price: manual, date: best ? best.date : null, fromManual: true };
  }
  return best ? { price: best.price, date: best.date, fromManual: false } : null;
}

function valueHolding(holding, navValue) {
  if (!holding || holding.units <= 0) return { marketValue: 0, missing: false };
  const nav = Number(navValue);
  if (!Number.isFinite(nav) || nav <= 0) return { marketValue: null, missing: true };
  return { marketValue: nav * holding.units, missing: false };
}

// 計算兩個日期間的交易日數（粗略：排除週末，不含節假日）
function tradingDaysBetween(fromDate, toDate) {
  if (!fromDate || !toDate || fromDate >= toDate) return 0;
  let n = 0;
  let cur = fromDate;
  let guard = 0;
  while (cur < toDate && guard++ < 400) {
    cur = addDays(cur, 1);
    const dow = new Date(cur + "T00:00:00").getDay();
    if (dow !== 0 && dow !== 6) n++;
  }
  return n;
}

// 預估基金淨值
function estimateFundNav({ lastNav, lastNavDate, stockRatio, basketChangePct, today }) {
  if (!lastNav || !isFinite(lastNav) || lastNav <= 0) return null;
  if (basketChangePct === null || !isFinite(basketChangePct)) return null;
  const ratio = Math.max(0, Math.min(100, Number(stockRatio) || 0)) / 100;
  const estChangePct = ratio * basketChangePct;
  const estNav = lastNav * (1 + estChangePct / 100);
  const pendingDays = lastNavDate ? tradingDaysBetween(lastNavDate, today) : 0;
  return { estNav, estChangePct, pendingDays, lastNav, lastNavDate };
}


// 極簡 Markdown → HTML（僅供 AI 回覆渲染，已先做 HTML 轉義避免 XSS）
function mdToHtml(src) {
  if (!src) return "";
  let s = String(src)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/```([\s\S]*?)```/g, (m, c) => `<pre class="fl-md-pre">${c.replace(/^\n/, "").replace(/\n$/, "")}</pre>`);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/(?:^|\n)([-*])\s+([^\n]+)/g, "\n<li>$2</li>");
  if (s.indexOf("<li>") >= 0) s = "<ul>" + s.replace(/\n<li>/g, "<li>") + "</ul>";
  s = s.replace(/\n/g, "<br>");
  return s;
}

function CalendarGrid({ transactions, fundNames, holdings, navMap, priceHistory, gainMode, s }) {
  const today = useMemo(() => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }, []);
  const [cur, setCur] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() + 1 }; });
  const [selectedDay, setSelectedDay] = useState(null);
  const monthKey = cur.y + "-" + String(cur.m).padStart(2, "0");
  useEffect(() => { setSelectedDay(null); }, [monthKey, gainMode]);

  // 已實現收益：一次算全量按日期分組
  const realizedByDate = useMemo(() => {
    const map = {};
    for (const g of computeRealizedGains(transactions, fundNames)) {
      if (!map[g.date]) map[g.date] = { date: g.date, total: 0, items: [], currency: g.currency, mainCcy: g.currency };
      map[g.date].total += g.gain;
      map[g.date].items.push(g);
    }
    return map;
  }, [transactions, fundNames]);

  // 預估收益：每日浮動盈虧序列
  const floating = useMemo(
    () => (gainMode === "estimated" ? computeDailyFloatingSeries(transactions, priceHistory, navMap, today) : { byDate: {}, dates: [] }),
    [gainMode, transactions, priceHistory, navMap, today]
  );

  const byDate = gainMode === "estimated" ? floating.byDate : realizedByDate;

  // 42 格網格（6 週 × 7 天）
  const grid = useMemo(() => {
    const firstDow = new Date(cur.y, cur.m - 1, 1).getDay();
    const dim = new Date(cur.y, cur.m, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push({ key: "pad-" + i, pad: true });
    for (let d = 1; d <= dim; d++) {
      const date = monthKey + "-" + String(d).padStart(2, "0");
      const data = byDate[date] || null;
      cells.push({ key: date, date, d, data,
        isToday: date === today, isFuture: date > today,
        hasData: !!data, pos: data ? data.total >= 0 : true });
    }
    while (cells.length % 7 !== 0) cells.push({ key: "pad-t" + cells.length, pad: true });
    return cells;
  }, [cur, monthKey, byDate, today]);

  // 月摘要統計
  const monthStat = useMemo(() => {
    const days = grid.filter((c) => !c.pad && c.hasData);
    if (days.length === 0) return [];
    if (gainMode === "estimated") {
      const last = days[days.length - 1].data;
      const first = days[0].data;
      const change = last.total - first.total;
      const best  = days.reduce((a, b) => (b.data.total > a.data.total ? b : a));
      const worst = days.reduce((a, b) => (b.data.total < a.data.total ? b : a));
      return [
        { label: "月末浮盈", value: fmtSigned(last.total),  color: last.total >= 0 ? "var(--pos)" : "var(--neg)" },
        { label: "當月變動", value: fmtSigned(change),      color: change    >= 0 ? "var(--pos)" : "var(--neg)" },
        { label: "最高 " + best.d + " 日",  value: fmtSigned(best.data.total),  color: "var(--text-2)" },
        { label: "最低 " + worst.d + " 日", value: fmtSigned(worst.data.total), color: "var(--text-2)" },
      ];
    }
    const sum = days.reduce((a, c) => a + c.data.total, 0);
    return [
      { label: "本月已實現", value: fmtSigned(sum), color: sum >= 0 ? "var(--pos)" : "var(--neg)" },
      { label: "交易日數",   value: String(days.length), color: "var(--text-2)" },
    ];
  }, [grid, gainMode]);

  const goPrev = () => setCur((c) => (c.m === 1 ? { y: c.y - 1, m: 12 } : { y: c.y, m: c.m - 1 }));
  const goNext = () => setCur((c) => (c.m === 12 ? { y: c.y + 1, m: 1 } : { y: c.y, m: c.m + 1 }));
  const atCurrentMonth = monthKey >= today.slice(0, 7);
  const weekDays = ["日", "一", "二", "三", "四", "五", "六"];

  return (
    <div>
      {/* ── 月份導航 ─────────────────────────── */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 18, marginBottom: 14 }}>
        <button className="fl-cal-nav" onClick={goPrev} aria-label="上個月"><ChevronLeft size={16} /></button>
        <div style={{ textAlign: "center", minWidth: 128 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: "var(--text)" }}>{cur.y}年{cur.m}月</div>
          <div style={{ fontSize: 10.5, color: "var(--text-4)", marginTop: 1 }}>
            {gainMode === "estimated" ? "預估收益 · 累計浮動盈虧" : "已實現收益"}
          </div>
        </div>
        <button className="fl-cal-nav" onClick={goNext} disabled={atCurrentMonth} aria-label="下個月"><ChevronRight size={16} /></button>
      </div>

      {/* ── 月摘要條 ─────────────────────────── */}
      {monthStat.length > 0 && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {monthStat.map((k) => (
            <div key={k.label} style={{ flex: 1, minWidth: 0, background: "var(--surface)", border: "1px solid var(--border-soft)",
              borderRadius: "var(--r-md)", boxShadow: "var(--shadow-card)", padding: "8px 10px" }}>
              <div style={{ fontSize: 10, color: "var(--text-4)" }}>{k.label}</div>
              <div style={{ ...s.mono, fontSize: "clamp(10px, 2.9vw, 13.5px)", fontWeight: 700,
                color: k.color, overflow: "hidden", whiteSpace: "nowrap" }}>{k.value}</div>
            </div>
          ))}
        </div>
      )}

      {/* ── 星期標題 ─────────────────────────── */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 6, marginBottom: 6 }}>
        {weekDays.map((w, i) => (
          <div key={w} style={{ textAlign: "center", fontSize: 11, fontWeight: 500, padding: "2px 0",
            color: (i === 0 || i === 6) ? "var(--accent)" : "var(--text-4)" }}>{w}</div>
        ))}
      </div>

      {/* ── 日期格子 ─────────────────────────── */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 6 }}>
        {grid.map((c) => {
          if (c.pad) return <div key={c.key} style={{ minHeight: 64 }} />;
          const sel = selectedDay === c.date;
          const bg = c.isToday ? "var(--cal-today-bg)"
                   : c.hasData ? (c.pos ? "var(--cal-pos-bg)" : "var(--cal-neg-bg)")
                   : "var(--cal-idle-bg)";
          const fg = c.isToday ? "var(--cal-today-text)"
                   : c.hasData ? (c.pos ? "var(--cal-pos-text)" : "var(--cal-neg-text)")
                   : "var(--cal-idle-text)";
          return (
            <div key={c.key} className={"fl-cal-cell" + (c.hasData ? " clickable" : "")}
              onClick={() => c.hasData && setSelectedDay(sel ? null : c.date)}
              style={{
                minHeight: 64, minWidth: 0, borderRadius: "var(--r-cell)", padding: "8px 2px",
                background: bg, color: fg, position: "relative",
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3,
                cursor: c.hasData ? "pointer" : "default",
                opacity: c.isFuture ? 0.45 : 1,
                boxShadow: sel ? "0 0 0 2px var(--accent)" : "none",
              }}>
              <span style={{ fontSize: c.isToday ? 13 : 12.5, fontWeight: c.isToday ? 700 : 500,
                             opacity: c.isToday ? 1 : 0.78, lineHeight: 1 }}>
                {c.isToday ? "今" : c.d}
              </span>
              <span style={{ ...s.mono, maxWidth: "100%", overflow: "hidden", whiteSpace: "nowrap",
                             fontSize: "clamp(7px, 2.2vw, 10.5px)", fontWeight: 600, lineHeight: 1.1, letterSpacing: "-0.04em" }}>
                {c.isFuture ? "—" : c.hasData ? fmtSigned(c.data.total) : "0.00"}
              </span>
              {c.hasData && c.data.multiCcy && (
                <span style={{ position: "absolute", top: 5, right: 6, width: 4, height: 4,
                               borderRadius: "50%", background: "currentColor", opacity: 0.6 }} />
              )}
            </div>
          );
        })}
      </div>

      {/* ── 明細面板 ─────────────────────────── */}
      {selectedDay && byDate[selectedDay] && (
        gainMode === "estimated"
          ? <EstimatedDayDetail day={byDate[selectedDay]} fundNames={fundNames} s={s} />
          : <RealizedDayDetail day={byDate[selectedDay]} s={s} />
      )}

      {/* ── 空狀態 ──────────────────────────── */}
      {grid.every((c) => c.pad || !c.hasData) && (
        <div style={{ ...s.emptyState, padding: "28px 20px", marginTop: 14 }}>
          <Calendar size={28} />
          <p style={{ margin: "10px 0 0", fontSize: 12.5, color: "var(--text-4)" }}>
            {gainMode === "estimated" ? "本月無可估值的持倉" : "本月無已實現收益紀錄"}
          </p>
          {gainMode === "estimated" && (
            <p style={{ margin: "4px 0 0", fontSize: 11, color: "var(--text-faint)" }}>
              需有持倉，且該期間內有淨值紀錄（可到持倉卡片「價格紀錄」補登）
            </p>
          )}
        </div>
      )}
    </div>
  );
}

function RealizedDayDetail({ day, s }) {

let ACTIVE_ACCOUNT = "Micy";
function acctKey(base) { return `fundLedger_${ACTIVE_ACCOUNT}_${base}`; }

const storage = {
  get: async (key) => {
    try {
      const val = localStorage.getItem(acctKey(key));
      return val ? { value: val } : null;
    } catch (e) { return null; }
  },
  set: async (key, value) => {

  },
};

// GitHub Pages 只使用原 WorkBuddy API 提供的行情與股票搜尋；私人同步需另建受保護的後端。
const BACKEND_ORIGIN = "https://micyfundledger.bj3.agentos-app.net";
function apiUrl(path) { return BACKEND_ORIGIN + path; }

// Sync helpers (for non-async localStorage access)
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch(e) {}
}

// 密碼驗證資料只存在本機瀏覽器；公開的 HTML 不包含密碼或其雜湊。
function readPasswordVerifier() {
  const saved = lsGet(PASSWORD_VERIFIER_KEY, null);
  return saved && saved.version === 1 && saved.salt && saved.hash && saved.iterations
    ? saved : null;
}
function encodeBytes(bytes) {
  return btoa(String.fromCharCode(...bytes));
}
function decodeBytes(value) {
  return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
}
async function derivePasswordHash(password, salt, iterations) {
  if (!window.crypto || !window.crypto.subtle) throw new Error("此瀏覽器無法安全驗證密碼");
  const key = await window.crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]
  );
  const bits = await window.crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" }, key, 256
  );
  return new Uint8Array(bits);
}
async function createPasswordVerifier(password) {
  const salt = window.crypto.getRandomValues(new Uint8Array(16));
  const iterations = 310000;
  const hash = await derivePasswordHash(password, salt, iterations);
  return { version: 1, iterations, salt: encodeBytes(salt), hash: encodeBytes(hash) };
}
async function matchesPassword(password, verifier) {
  const expected = decodeBytes(verifier.hash);
  const actual = await derivePasswordHash(password, decodeBytes(verifier.salt), verifier.iterations);
  if (actual.length !== expected.length) return false;
  let difference = 0;
  for (let i = 0; i < actual.length; i++) difference |= actual[i] ^ expected[i];
  return difference === 0;
}

// ---------------------------------------------------------------------------
function FundCard({ code, holding, nav, name, active, onToggleActive, onNavChange, priceHistory, onOpenPriceHistory, onOpenChart }) {
  const [calcOpen, setCalcOpen] = useState(false);
  const [sellPrice, setSellPrice] = useState("");
  const [sellUnits, setSellUnits] = useState("");

  const ccy = holding.currency || DEFAULT_CCY;
  const marketValue = nav && holding.units > 0 ? nav * holding.units : holding.cost;
  const gain = marketValue - holding.cost;
  const gainPct = holding.cost > 0 ? (gain / holding.cost) * 100 : 0;
  const avgCost = holding.units > 0 ? holding.cost / holding.units : 0;

  const effSellUnits = sellUnits === "" ? holding.units : parseFloat(sellUnits) || 0;
  const effSellPrice = parseFloat(sellPrice);
  const proceeds = !Number.isNaN(effSellPrice) ? effSellPrice * effSellUnits : null;
  const costRemoved = avgCost * effSellUnits;
  const simGain = proceeds !== null ? proceeds - costRemoved : null;
  const simGainPct = costRemoved > 0 && simGain !== null ? (simGain / costRemoved) * 100 : null;

  const hist = priceHistory[code] || [];
  const hasHistory = hist.length > 0;

  return (
    <div style={{...s.fundCard, borderColor: active ? "var(--accent)" : "var(--border)"}} className="fl-fade">
      <div onClick={onToggleActive} style={{ cursor: "pointer" }}>
        <div style={s.fundCardTop}>
          <div>
            <span style={s.fundName}>{code}</span>
            {(name || holding.house) && (
              <div style={{ fontSize: 11, color: "var(--text-4)", marginTop: 2, display: "flex", alignItems: "center", gap: 6 }}>
                {name && <span style={{ color: "var(--text-3)" }}>{name}</span>}
                {holding.house && <span>· {holding.house}</span>}
              </div>
            )}
          </div>
          <span style={s.fundUnits}>{fmtNum(holding.units, 3)} 單位</span>
        </div>
        <div style={s.fundCardRow}>
          <span style={s.miniLabel}>平均成本</span>
          <span style={s.miniValue}>{ccySymbol(ccy)}{fmtNum(avgCost, 4)}</span>
        </div>
      </div>
      <div style={s.fundCardRow} onClick={(e) => e.stopPropagation()}>
        <span style={s.miniLabel}>目前淨值</span>
        <input type="number" step="0.001" placeholder="輸入淨值"
          value={nav ?? ""}
          onChange={(e) => onNavChange(e.target.value === "" ? "" : parseFloat(e.target.value))}
          style={s.navInput} />
      </div>
      <div style={{...s.fundCardRow, marginTop: 2}} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", gap: 4 }}>
          <button type="button" style={s.cardActionBtn} onClick={() => onOpenPriceHistory(code)} title="價格紀錄">
            <ListOrdered size={11} /> 價格紀錄
          </button>
          <button type="button" style={{...s.cardActionBtn, opacity: hasHistory ? 1 : 0.4}} onClick={() => { if(hasHistory) onOpenChart(code); }} title={hasHistory ? "走勢圖" : "尚無價格紀錄"}>
            <LineChart size={11} /> 走勢圖
          </button>
        </div>
      </div>
      {holding.units > 0 && nav ? (
        <div style={s.fundCardFooter}>
          <span style={{...s.gainTag, color: gain >= 0 ? "var(--accent)" : "var(--neg)", borderColor: gain >= 0 ? "var(--pos-border)" : "var(--neg-border)"}}>
            {gain >= 0 ? "▲" : "▼"} {fmtMoney(Math.abs(gain), ccy)} ({gainPct.toFixed(1)}%)
          </span>
        </div>
      ) : (
        <div style={s.fundCardFooterMuted}>尚未設定淨值</div>
      )}

      {holding.units > 0 && (
        <div style={{ marginTop: 8 }} onClick={(e) => e.stopPropagation()}>
          <button type="button" style={s.calcToggle}
            onClick={() => { setCalcOpen((v) => !v); if (!sellPrice && nav) setSellPrice(String(nav)); }}>
            <Calculator size={12} />
            試算賣出損益
            <ChevronDown size={12} style={{ transform: calcOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
          </button>
          {calcOpen && (
            <div style={s.calcPanel} className="fl-fade">
              <div style={s.calcRow}>
                <span style={s.miniLabel}>賣出單位數</span>
                <input type="number" style={s.navInput} placeholder={fmtNum(holding.units, 3)}
                  value={sellUnits} onChange={(e) => setSellUnits(e.target.value)} />
              </div>
              <div style={s.calcRow}>
                <span style={s.miniLabel}>賣出價格</span>
                <input type="number" step="0.001" style={s.navInput} placeholder="0.000"
                  value={sellPrice} onChange={(e) => setSellPrice(e.target.value)} />
              </div>
              {proceeds !== null && !Number.isNaN(effSellUnits) && (
                <div style={s.calcResult}>
                  <div style={s.calcResultRow}>
                    <span style={s.miniLabel}>預估收回</span>
                    <span style={s.miniValue}>{fmtMoney(proceeds, ccy)}</span>
                  </div>
                  <div style={s.calcResultRow}>
                    <span style={s.miniLabel}>對應成本</span>
                    <span style={s.miniValue}>{fmtMoney(costRemoved, ccy)}</span>
                  </div>
                  <div style={s.calcResultRow}>
                    <span style={s.miniLabel}>預估損益</span>
                    <span style={{...s.miniValue, fontWeight: 700, color: simGain >= 0 ? "var(--accent)" : "var(--neg)"}}>
                      {simGain >= 0 ? "+" : ""}{fmtMoney(simGain, ccy)} ({simGainPct === null ? "—" : `${simGainPct.toFixed(1)}%`})
                    </span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TransactionForm({ initial, fundCodes, onCancel, onSave, onDelete }) {
  const [house, setHouse] = useState(initial?.house || "");
  const [fundCode, setFundCode] = useState(initial?.fundCode || "");
  const [type, setType] = useState(initial?.type || "buy");
  const [date, setDate] = useState(initial?.date || todayStr());
  const [nav, setNav] = useState(initial?.nav ?? "");
  const [units, setUnits] = useState(initial?.units ?? "");
  const [amount, setAmount] = useState(initial?.amount ?? "");
  const [fee, setFee] = useState(initial?.fee ?? "");
  const [currency, setCurrency] = useState(initial?.currency || DEFAULT_CCY);
  const [refNo, setRefNo] = useState(initial?.refNo || "");
  const [note, setNote] = useState(initial?.note || "");
  const [touched, setTouched] = useState(false);

  const isDividend = type === "dividend";
  const navNum = parseFloat(nav);
  const unitsNum = parseFloat(units);
  const amountNum = parseFloat(amount);

  useEffect(() => {
    if (!isDividend && !Number.isNaN(navNum) && !Number.isNaN(unitsNum) && amount === "") {
      setAmount((navNum * unitsNum).toFixed(2));
    }
  }, [nav, units]);

  const valid =
    fundCode.trim() !== "" &&
    date !== "" &&
    !Number.isNaN(amountNum) && amountNum > 0 &&
    (isDividend || (!Number.isNaN(unitsNum) && unitsNum > 0));

  function handleSubmit(e) {
    e.preventDefault();
    setTouched(true);
    if (!valid) return;
    onSave({
      house: house.trim(),
      fundCode: fundCode.trim(),
      type,
      date,
      nav: isDividend ? null : Number.isNaN(navNum) ? null : navNum,
      units: isDividend ? 0 : unitsNum,
      amount: amountNum,
      fee: Number.isNaN(parseFloat(fee)) ? 0 : parseFloat(fee),
      currency: currency.trim().toUpperCase() || DEFAULT_CCY,
      refNo: refNo.trim(),
      note: note.trim(),
    });
  }

  return (
    <div style={s.modalBackdrop} onClick={onCancel}>
      <form style={s.modal} onClick={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <div style={s.modalHeader}>
          <h2 style={s.modalTitle}>{initial ? "編輯交易" : "手動新增交易"}</h2>
          <button type="button" style={s.closeBtn} onClick={onCancel}><X size={18} /></button>
        </div>
        <div style={s.formGrid}>
          <label style={s.field}>
            <span style={s.fieldLabel}>發行機構（選填）</span>
            <input style={s.input} value={house} onChange={(e) => setHouse(e.target.value)} placeholder="例如：滙豐" />
          </label>
          <label style={s.field}>
            <span style={s.fieldLabel}>基金代碼</span>
            <input style={s.input} value={fundCode} onChange={(e) => setFundCode(e.target.value)}
              placeholder="例如：U50009" list="fund-code-list" autoFocus />
            <datalist id="fund-code-list">
              {fundCodes.map((c) => <option key={c} value={c} />)}
            </datalist>
            {touched && !fundCode.trim() && <span style={s.fieldError}>請輸入基金代碼</span>}
          </label>
          <label style={s.field}>
            <span style={s.fieldLabel}>交易類型</span>
            <div style={s.typeToggle}>
              {Object.entries(TYPE_META).map(([key, meta]) => (
                <button type="button" key={key} onClick={() => setType(key)}
                  style={{...s.typeToggleBtn, ...(type === key ? { background: meta.color + "22", color: meta.color, borderColor: meta.color } : {}) }}>
                  {meta.label}
                </button>
              ))}
            </div>
          </label>
          <label style={s.field}>
            <span style={s.fieldLabel}>交易日期</span>
            <input type="date" style={s.input} value={date} onChange={(e) => setDate(e.target.value)} />
          </label>
          {!isDividend && (
            <label style={s.field}>
              <span style={s.fieldLabel}>成交價（選填）</span>
              <input type="number" step="0.001" style={{...s.input, ...s.mono}}
                value={nav} onChange={(e) => setNav(e.target.value)} placeholder="0.000" />
            </label>
          )}
          {!isDividend && (
            <label style={s.field}>
              <span style={s.fieldLabel}>單位數</span>
              <input type="number" step="0.001" style={{...s.input, ...s.mono}}
                value={units} onChange={(e) => setUnits(e.target.value)} placeholder="0.000" />
              {touched && (Number.isNaN(unitsNum) || unitsNum <= 0) && <span style={s.fieldError}>請輸入大於 0 的單位數</span>}
            </label>
          )}
          <label style={s.field}>
            <span style={s.fieldLabel}>{isDividend ? "派息金額" : "交易金額"}</span>
            <input type="number" style={{...s.input, ...s.mono}}
              value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" />
            {touched && (Number.isNaN(amountNum) || amountNum <= 0) && <span style={s.fieldError}>請輸入大於 0 的金額</span>}
          </label>
          <label style={s.field}>
            <span style={s.fieldLabel}>幣別</span>
            <input style={s.input} value={currency} onChange={(e) => setCurrency(e.target.value.toUpperCase())} placeholder="HKD" />
          </label>
          {!isDividend && (
            <label style={s.field}>
              <span style={s.fieldLabel}>手續費（選填）</span>
              <input type="number" style={{...s.input, ...s.mono}}
                value={fee} onChange={(e) => setFee(e.target.value)} placeholder="0" />
            </label>
          )}
          <label style={s.field}>
            <span style={s.fieldLabel}>參考編號（選填）</span>
            <input style={s.input} value={refNo} onChange={(e) => setRefNo(e.target.value)} placeholder="例如：P188330" />
          </label>
          <label style={{...s.field, gridColumn: "1 / -1"}}>
            <span style={s.fieldLabel}>備註（選填）</span>
            <input style={s.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="例如：定期定額扣款" />
          </label>
        </div>
        <div style={{...s.modalFooter, ...(initial ? { justifyContent: "space-between" } : {})}}>
          {initial && (
            <button type="button" style={s.dangerBtn} onClick={() => onDelete(initial.id)} title="刪除這筆交易">
              <Trash2 size={13} /> 刪除交易
            </button>
          )}
          <div style={{ display: "flex", gap: 10 }}>
            <button type="button" style={s.cancelBtn} onClick={onCancel}>取消</button>
            <button type="submit" style={s.saveBtn} className="fl-btn">
              {initial ? "儲存變更" : "新增交易"}
            </button>
          </div>
        </div>
      </form>
    </div>
  );
}

function FundNameModal({ holdings, fundNames, onSave, onClose }) {
  const allCodes = useMemo(() => {
    const set = new Set([...Object.keys(holdings), ...Object.keys(fundNames)]);
    return [...set].sort((a, b) => a.localeCompare(b, "zh-TW"));
  }, [holdings, fundNames]);

  const [editMap, setEditMap] = useState({...fundNames});
  // also pre-populate any code not in fundNames
  useEffect(() => {
    setEditMap((prev) => {
      const next = {...prev};
      for (const code of allCodes) {
        if (!(code in next)) next[code] = "";
      }
      return next;
    });
  }, [allCodes]);

  function handleSave() {
    const cleaned = {};
    for (const [code, name] of Object.entries(editMap)) {
      if (name.trim()) cleaned[code] = name.trim();
    }
    onSave(cleaned);
    onClose();
  }

  return (
    <div style={s.modalBackdrop} onClick={onClose}>
      <div style={{...s.modal, maxWidth: 520}} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalHeader}>
          <h2 style={s.modalTitle}>基金管理</h2>

        </div>
        <p style={{ fontSize: 12, color: "var(--text-3)", marginBottom: 12 }}>為各基金代碼設定便於識別的名稱，儲存後生效。</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: "50vh", overflowY: "auto" }}>
          {allCodes.length === 0 && <p style={{ fontSize: 12.5, color: "var(--text-4)", textAlign: "center", padding: 20 }}>尚無基金紀錄</p>}

            <div key={code} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0" }}>
              <span style={{...s.mono, fontSize: 13, fontWeight: 600, minWidth: 80}}>{code}</span>

                type="text"

                placeholder="輸入基金名稱"

                {holdings[code]?.house || ""}
              </span>
            </div>
          ))}
        </div>
        <div style={s.modalFooter}>
          <button type="button" style={s.cancelBtn} onClick={onClose}>取消</button>
          <button type="button" style={s.saveBtn} className="fl-btn" onClick={handleSave}>儲存</button>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
function PriceHistoryModal({ fundCode, fundName, priceHistory, onSave, onClose }) {
  const records = (priceHistory[fundCode] || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const [newDate, setNewDate] = useState(todayStr());
  const [newPrice, setNewPrice] = useState("");

  function addRecord() {
    const price = parseFloat(newPrice);
    if (!newDate || Number.isNaN(price) || price <= 0) return;
    const existing = records.filter((r) => r.date !== newDate);
    const updated = [...existing, { date: newDate, price }].sort((a, b) => (a.date < b.date ? 1 : -1));
    onSave({ ...priceHistory, [fundCode]: updated });
    setNewPrice("");
  }

  function removeRecord(date) {
    const updated = records.filter((r) => r.date !== date);
    if (updated.length === 0) {
      const next = { ...priceHistory };
      delete next[fundCode];
      onSave(next);
    } else {
      onSave({ ...priceHistory, [fundCode]: updated });
    }
  }

  return (
    <div style={s.modalBackdrop} onClick={onClose}>
      <div style={{...s.modal, maxWidth: 480}} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalHeader}>
          <h2 style={s.modalTitle}>價格紀錄 — {fundCode}{fundName ? ` (${fundName})` : ""}</h2>
          <button type="button" style={s.closeBtn} onClick={onClose}><X size={18} /></button>
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 14, alignItems: "flex-end" }}>
          <label style={{...s.field, flex: 1 }}>
            <span style={s.fieldLabel}>日期</span>
            <input type="date" style={s.input} value={newDate} onChange={(e) => setNewDate(e.target.value)} />
          </label>
          <label style={{...s.field, flex: 1 }}>
            <span style={s.fieldLabel}>淨值</span>

// ---------------------------------------------------------------------------
// Nav Chart (pure SVG)
// ---------------------------------------------------------------------------
function NavChart({ fundCode, fundName, priceHistory, avgCost, currency, onClose, transactions }) {
  const records = (priceHistory[fundCode] || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const W = 580, H = 280;
  const padL = 65, padR = 20, padT = 20, padB = 58;

  if (records.length < 2) {
    return (
      <div style={s.modalBackdrop} onClick={onClose}>
        <div style={{...s.modal, maxWidth: 600}} onClick={(e) => e.stopPropagation()}>
          <div style={s.modalHeader}>
            <h2 style={s.modalTitle}>淨值走勢 — {fundCode}{fundName ? ` (${fundName})` : ""}</h2>
            <button type="button" style={s.closeBtn} onClick={onClose}><X size={18} /></button>
          </div>
          <p style={{ fontSize: 13, color: "var(--text-4)", textAlign: "center", padding: 30 }}>需要至少 2 筆價格紀錄才能繪製走勢圖。</p>
          <div style={s.modalFooter}><button type="button" style={s.cancelBtn} onClick={onClose}>關閉</button></div>
        </div>
      </div>
    );
  }

  const prices = records.map((r) => r.price);
  const minP = Math.min(...prices);
  const maxP = Math.max(...prices);
  const range = maxP - minP || 1;
  const yMin = Math.max(0, minP - range * 0.1);
  const yMax = maxP + range * 0.1;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  function xPos(i) { return padL + (i / Math.max(records.length - 1, 1)) * plotW; }
  function yPos(v) { return padT + (1 - (v - yMin) / (yMax - yMin || 1)) * plotH; }

  const firstP = records[0].price;
  const lastP = records[records.length - 1].price;
  const changePct = firstP > 0 ? ((lastP - firstP) / firstP) * 100 : 0;

  // Y axis ticks
  const yStep = (yMax - yMin) / 4;
  const yTicks = [0, 1, 2, 3, 4].map((i) => yMin + yStep * i);

  // X axis labels (show at most ~8 evenly spaced)
  const xLabelIndices = [];
  const step = Math.max(1, Math.floor(records.length / 7));
  for (let i = 0; i < records.length; i += step) xLabelIndices.push(i);
  if (xLabelIndices[xLabelIndices.length - 1] !== records.length - 1) xLabelIndices.push(records.length - 1);

  const linePath = records.map((r, i) => `${i === 0 ? "M" : "L"}${xPos(i)},${yPos(r.price)}`).join(" ");
  const costY = avgCost > 0 ? yPos(avgCost) : null;

  // 買賣打點：從 transactions 中取出該基金的 buy/sell 記錄，匹配到走勢圖的日期索引
  const tradeMarks = [];
  if (transactions && Array.isArray(transactions)) {
    const dateIndexMap = {};
    records.forEach((r, i) => { dateIndexMap[r.date] = i; });
    for (const t of transactions) {
      if (t.fundCode !== fundCode) continue;
      if (t.type !== "buy" && t.type !== "sell") continue;
      const idx = dateIndexMap[t.date];
      if (idx === undefined) continue;
      tradeMarks.push({
        x: xPos(idx),
        y: yPos(t.nav || t.price || records[idx].price),
        type: t.type,
        label: t.type === "buy" ? "B" : "S",
        amount: t.amount,
      });
    }
  }

  return (
    <div style={s.modalBackdrop} onClick={onClose}>
      <div style={{...s.modal, maxWidth: 620}} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalHeader}>
          <h2 style={s.modalTitle}>淨值走勢 — {fundCode}{fundName ? ` (${fundName})` : ""}</h2>
          <button type="button" style={s.closeBtn} onClick={onClose}><X size={18} /></button>
        </div>
        <div style={{ display: "flex", gap: 20, marginBottom: 10, fontSize: 12 }}>
          <span style={{ color: "var(--text-3)" }}>區間：{records[0].date} ~ {records[records.length-1].date}</span>
          <span style={{ color: changePct >= 0 ? POS_COLOR : NEG_COLOR, fontWeight: 600 }}>
            {changePct >= 0 ? "+" : ""}{changePct.toFixed(2)}%
          </span>
          <span style={{ color: "var(--text-4)" }}>最高：{ccySymbol(currency)}{fmtNum(maxP, 4)}</span>
          <span style={{ color: "var(--text-4)" }}>最低：{ccySymbol(currency)}{fmtNum(minP, 4)}</span>
          {avgCost > 0 && <span style={{ color: "var(--text-4)" }}>成本：{ccySymbol(currency)}{fmtNum(avgCost, 4)}</span>}
        </div>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", background: "var(--inset)", borderRadius: 4 }}>
          {/* Grid lines */}
          {yTicks.map((v) => (
            <g key={v}>
              <line x1={padL} y1={yPos(v)} x2={W - padR} y2={yPos(v)} stroke="var(--border-soft)" strokeWidth={0.5} />
              <text x={padL - 8} y={yPos(v) + 4} fill="var(--text-4)" fontSize={10} textAnchor="end" fontFamily="JetBrains Mono, monospace">
                {ccySymbol(currency)}{fmtNum(v, 4)}
              </text>
            </g>
          ))}
          {/* Cost line */}
          {costY !== null && costY >= padT && costY <= H - padB && (
            <g>
              <line x1={padL} y1={costY} x2={W - padR} y2={costY} stroke="var(--text-4)" strokeWidth={1} strokeDasharray="6,3" />
              <text x={W - padR - 4} y={costY - 5} fill="var(--text-4)" fontSize={9} textAnchor="end" fontFamily="JetBrains Mono, monospace">成本</text>
            </g>
          )}
          {/* Line */}
          <path d={linePath} fill="none" stroke="var(--accent)" strokeWidth={2} />
          {/* Dots */}
          {records.map((r, i) => (
            <circle key={i} cx={xPos(i)} cy={yPos(r.price)} r={2.5} fill="var(--accent)" />
          ))}
          {/* 買(B)/賣(S) 打點 */}
          {tradeMarks.map((m, i) => {
            const isBuy = m.type === "buy";
            const color = isBuy ? "var(--pos)" : "var(--neg)";
            return (
              <g key={"tm" + i}>
                <circle cx={m.x} cy={m.y} r={11} fill={color} opacity={0.92} stroke="var(--surface)" strokeWidth={1.5} />
                <text x={m.x} y={m.y + 3.5} fill="#FFFFFF" fontSize={10} fontWeight={700} textAnchor="middle" fontFamily="'Noto Sans TC', sans-serif">{m.label}</text>
              </g>
            );
          })}
          {/* X labels */}
          {xLabelIndices.map((i) => {
            const xp = xPos(i);
            const yp = H - 20;
            const label = records[i].date.slice(5);
            return (
              <text key={i} x={xp} y={yp} fill="var(--text-3)" fontSize={9} textAnchor="end"
                transform={`rotate(-30, ${xp}, ${yp})`} fontFamily="JetBrains Mono, monospace">
                {label}
              </text>
            );
          })}
          {/* Axes */}
          <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke="var(--scrollbar)" strokeWidth={1} />
          <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="var(--scrollbar)" strokeWidth={1} />
        </svg>
        <div style={s.modalFooter}>
          <button type="button" style={s.cancelBtn} onClick={onClose}>關閉</button>
        </div>
      </div>
    </div>
  );
}

// 預估市值明細：按平台（銀行）分組，顯示各平台的預估市值、投入成本、漲跌幅
function MarketValueModal({ holdings, navMap, fundNames, totalsByCcy, onClose }) {
  const byHouse = useMemo(() => {
    const map = {}; // { ccy: { house: { cost, mv, count } } }
    Object.keys(holdings).forEach((code) => {
      const h = holdings[code];
      if (h.units <= 0) return;
      const ccy = h.currency || DEFAULT_CCY;
      const house = h.house || "未知";
      if (!map[ccy]) map[ccy] = {};
      if (!map[ccy][house]) map[ccy][house] = { cost: 0, mv: 0, count: 0, unpricedCount: 0 };
      const valuation = valueHolding(h, navMap[code]);
      map[ccy][house].cost += h.cost;
      if (!valuation.missing) map[ccy][house].mv += valuation.marketValue;
      else map[ccy][house].unpricedCount += 1;
      map[ccy][house].count += 1;
    });
    return map;
  }, [holdings, navMap]);

  return (
    <div style={s.modalBackdrop} onClick={onClose}>
      <div style={{...s.modal, maxWidth: 480}} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalHeader}>
          <h2 style={s.modalTitle}>預估市值明細</h2>
          <button type="button" style={s.closeBtn} onClick={onClose}><X size={18} /></button>
        </div>
        <div style={{ maxHeight: "60vh", overflowY: "auto" }}>
          {Object.entries(byHouse).map(([ccy, houses]) => (
            <div key={ccy} style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 11, color: "var(--text-faint)", marginBottom: 6, fontWeight: 600 }}>
                {ccySymbol(ccy)}
              </div>
              {Object.entries(houses).sort((a, b) => b[1].mv - a[1].mv).map(([house, d]) => {
                const complete = d.unpricedCount === 0;
                const gain = complete ? d.mv - d.cost : null;
                const pct = d.cost > 0 ? (gain / d.cost) * 100 : 0;
                return (
                  <div key={house} style={{ background: "var(--inset)", border: "1px solid var(--border-soft)", borderRadius: 4, padding: "12px 14px", marginBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                        <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text)" }}>{house}</span>
                        <span style={{ fontSize: 10.5, color: "var(--text-faint)" }}>{d.count} 檔</span>
                      </div>
                      <span style={{ ...s.mono, fontSize: 14, fontWeight: 700, color: complete ? (gain >= 0 ? POS_COLOR : NEG_COLOR) : "var(--text-4)" }}>
                        {complete ? <>{gain >= 0 ? "+" : ""}{fmtMoney(gain, ccy)}<span style={{ fontSize: 11, fontWeight: 500, marginLeft: 4 }}>({pct >= 0 ? "+" : ""}{pct.toFixed(1)}%)</span></> : "—"}
                      </span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 11.5 }}>
                      <div>
                        <span style={{ color: "var(--text-4)" }}>投入成本 </span>
                        <span style={{ ...s.mono, color: "var(--text-2)", fontWeight: 600 }}>{fmtMoney(d.cost, ccy)}</span>
                      </div>
                      <div>
                        <span style={{ color: "var(--text-4)" }}>預估市值 </span>
                        <span style={{ ...s.mono, color: "var(--text)", fontWeight: 600 }}>{complete ? fmtMoney(d.mv, ccy) : `缺 ${d.unpricedCount} 檔淨值`}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
        <p style={{ fontSize: 10.5, color: "var(--text-faint)", margin: "8px 0 0", lineHeight: 1.5 }}>
          預估市值優先採用「即時預估淨值」；沒有即時行情時，依序使用手填的「目前淨值」或最新有效的價格紀錄。完全缺少淨值時不會以投入成本冒充市值。
        </p>
        <div style={s.modalFooter}><button type="button" style={s.cancelBtn} onClick={onClose}>關閉</button></div>
      </div>
    </div>
  );
}

// 從 OCR 文字逐行抽取「股票名稱 + 權重%」
function parseHoldingLines(text) {
  const out = [];
  String(text || "").split("\n").forEach((line) => {
    const raw = line.trim();
    if (!raw) return;
    // 至少要有一個百分比數字才視為持倉行
    const pm = raw.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*[%％]/);
    if (!pm) return;
    const weight = parseFloat(pm[1].replace(",", "."));
    if (!isFinite(weight) || weight <= 0 || weight > 100) return;
    // 取百分比之前的部分作為名稱來源
    let namePart = raw.slice(0, pm.index);
    namePart = namePart.replace(/^[\s\d.、,，:：|]+/, "").replace(/[|]/g, " ").trim();
    const nm = namePart.match(/[\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9\-.·&\s]{0,20}/);
    if (!nm) return;
    const name = nm[0].replace(/\s+/g, "").trim();
    if (name.length < 2) return;
    // 過濾表頭類文字
    if (/占淨值|占净值|持股|比例|市值|名稱|名称|合計|合计|序號|序号/.test(name)) return;
    out.push({ name, weight });
  });
  // 同名去重，保留權重較大者
  const map = new Map();
  out.forEach((r) => {
    const prev = map.get(r.name);
    if (!prev || r.weight > prev.weight) map.set(r.name, r);
  });
  return [...map.values()].sort((a, b) => b.weight - a.weight).slice(0, 20);
}

// GitHub Pages 無法直接跨域呼叫 WorkBuddy 搜尋 API 時，仍保留常用標的的本機搜尋。
const LOCAL_STOCK_DIRECTORY = [
  ["hk00700", "騰訊控股", "腾讯控股"], ["hk00941", "中國移動", "中国移动"],
  ["hk00005", "匯豐控股", "汇丰控股"], ["hk01299", "友邦保險", "友邦保险"],
  ["hk09988", "阿里巴巴", "阿里巴巴"], ["hk03690", "美團", "美团"],
  ["sh600570", "恒生電子", "恒生电子"], ["sh000001", "上證指數", "上证指数"],
  ["sh000300", "滬深 300", "沪深 300"], ["sz399006", "創業板指", "创业板指"],
  ["hkHSI", "恒生指數", "恒生指数"], ["hkHSCEI", "恒生國企指數", "恒生国企指数"],
  ["hkHSTECH", "恒生科技指數", "恒生科技指数"], ["usINX", "標普 500", "标普 500"],
  ["usIXIC", "納斯達克", "纳斯达克"], ["usDJI", "道瓊斯", "道琼斯"],
].map(([code, name, simplified]) => ({ code, name, simplified }));

function localStockSearch(term) {
  const q = String(term || "").trim().toLowerCase();
  if (!q) return [];
  return LOCAL_STOCK_DIRECTORY.filter((x) =>
    [x.code, x.name, x.simplified].some((v) => String(v).toLowerCase().includes(q))
  ).map(({ code, name }) => ({ code, name }));
}

async function searchStockResults(term) {
  const local = localStockSearch(term);
  try {
    const r = await fetch(apiUrl("/api/stocksearch?q=" + encodeURIComponent(term)));
    const j = await r.json();
    const remote = (j && Array.isArray(j.results)) ? j.results : [];
    const seen = new Set();
    return [...remote, ...local].filter((x) => {
      if (!x || !x.code || seen.has(x.code)) return false;
      seen.add(x.code); return true;
    });
  } catch (e) {
    return local;
  }
}

function HoldingsOcrModal({ fundName, onApply, onClose }) {
  const [rows, setRows] = useState([]);
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState("");
  const [err, setErr] = useState("");
  const fileRef = useRef(null);

  const readAsDataUrl = (file) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });

  async function handleFiles(e) {
    const files = [...(e.target.files || [])];
    e.target.value = "";
    if (!files.length) return;
    setBusy(true); setErr(""); setProgress("");
    const collected = [];
    let worker = null;
    try {
      if (!window.Tesseract || !window.Tesseract.createWorker) throw new Error("OCR library unavailable");
      worker = await Tesseract.createWorker("chi_tra+eng", 1);
      for (let i = 0; i < files.length; i++) {
        setProgress(`辨識中 ${i + 1}/${files.length}…`);
        const result = await worker.recognize(files[i]);
        if (result && result.data && result.data.text) collected.push(...parseHoldingLines(result.data.text));
      }
      const merged = new Map();
      collected.forEach((r) => {
        const prev = merged.get(r.name);
        if (!prev || r.weight > prev.weight) merged.set(r.name, r);
      });
      let list = [...merged.values()].sort((a, b) => b.weight - a.weight).slice(0, 20)
        .map((r, i) => ({ ...r, tempId: "h" + i, code: "", matching: true }));
      if (!list.length) {
        setErr("未能從截圖中辨識出持倉，請確認截圖含「股票名稱 + 百分比」，或改用手動輸入。");
        setRows([]);
      } else {
        setRows(list);
        setProgress("配對股票代碼中…");
        for (let i = 0; i < list.length; i++) {
          let code = "";
          try {
            const matches = await searchStockResults(list[i].name);
            if (matches.length) code = matches[0].code;
          } catch (e2) {}
          list = list.map((x, k) => k === i ? { ...x, code, matching: false } : x);
          setRows(list);
        }
      }
    } catch (e3) {
      setErr("本機 OCR 辨識失敗，請確認圖片清晰、網路可載入 OCR 模組，或改用手動輸入。");
    } finally {
      if (worker) await worker.terminate().catch(() => {});
      setBusy(false); setProgress("");
    }
  }

  const update = (id, field, val) =>
    setRows((rs) => rs.map((r) => r.tempId === id ? { ...r, [field]: val } : r));
  const remove = (id) => setRows((rs) => rs.filter((r) => r.tempId !== id));

  const okRows = rows.filter((r) => r.code && String(r.code).trim() && Number(r.weight) > 0);

  return (
    <div style={s.modalBackdrop} onClick={onClose}>
      <div style={{ ...s.modal, maxWidth: 620 }} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalHeader}>
          <h2 style={s.modalTitle}>截圖匯入持倉{fundName ? ` · ${fundName}` : ""}</h2>
          <button type="button" style={s.closeBtn} onClick={onClose}><X size={18} /></button>
        </div>

        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={handleFiles} />

        <div style={{ ...s.parseBox, marginBottom: 12 }}>
          <p style={{ fontSize: 12, color: "var(--text-4)", margin: "0 0 10px", lineHeight: 1.6 }}>
            上傳銀行 App 或基金頁面的「十大持倉」截圖（可多張），系統會辨識股票名稱與佔比，並自動配對行情代碼。辨識結果可逐行修改。
          </p>
          <button type="button" style={{ ...s.parseBtn, display: "inline-flex", alignItems: "center", gap: 6 }}
            disabled={busy} onClick={() => fileRef.current && fileRef.current.click()}>
            <ImageIcon size={15} /> {busy ? (progress || "處理中…") : "選擇截圖"}
          </button>
        </div>

        {err && <p style={{ fontSize: 12, color: "var(--neg)", margin: "0 0 10px" }}>{err}</p>}

        {rows.length > 0 && (
          <div style={{ maxHeight: "44vh", overflowY: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 68px 28px", gap: 6, fontSize: 10.5, color: "var(--text-4)", padding: "0 2px 6px" }}>
              <span>股票名稱</span><span>行情代碼</span><span>權重 %</span><span />
            </div>
            {rows.map((r) => (
              <div key={r.tempId} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 68px 28px", gap: 6, marginBottom: 6, alignItems: "center" }}>
                <input style={s.previewInput} value={r.name} onChange={(e) => update(r.tempId, "name", e.target.value)} />
                <input style={{ ...s.previewInput, borderColor: r.code ? "var(--border)" : "var(--neg-border)" }}
                  placeholder={r.matching ? "配對中…" : "如 hk00700"}
                  value={r.code} onChange={(e) => update(r.tempId, "code", e.target.value.trim())} />
                <input style={s.previewInput} value={r.weight}
                  onChange={(e) => update(r.tempId, "weight", e.target.value)} inputMode="decimal" />
                <button type="button" style={s.previewRemove} onClick={() => remove(r.tempId)} title="移除"><X size={13} /></button>
              </div>
            ))}
          </div>
        )}

        {rows.length > 0 && (
          <div style={{ ...s.previewFooter, marginTop: 10 }}>
            <span style={{ fontSize: 12, color: "var(--text-3)" }}>
              {okRows.length}/{rows.length} 筆可套用 · 合計權重 {okRows.reduce((a, b) => a + (Number(b.weight) || 0), 0).toFixed(1)}%
            </span>
          </div>
        )}

        <div style={s.modalFooter}>
          <button type="button" style={s.cancelBtn} onClick={onClose}>取消</button>
          <button type="button" style={s.saveBtn} className="fl-btn" disabled={okRows.length === 0}
            onClick={() => onApply(okRows.map((r) => ({ code: r.code.trim(), name: r.name, weight: Number(r.weight) || 0 })))}>
            套用 {okRows.length} 筆
          </button>
        </div>
      </div>
    </div>
  );
}

                        <span style={{ ...s.mono, fontSize: 11, color: "var(--text-4)" }}>{r.code}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        <div style={s.modalFooter}>
          {tracking && (
            <button type="button" style={s.dangerBtn} onClick={() => onSave(fundCode, null)}>移除追蹤</button>
          )}
          <button type="button" style={s.cancelBtn} onClick={onClose}>取消</button>
          <button type="button" style={s.saveBtn} className="fl-btn" disabled={!canSave} onClick={handleSave}>儲存</button>
        </div>

        {ocrOpen && (
          <HoldingsOcrModal fundName={fundName}
            onClose={() => setOcrOpen(false)}
            onApply={(list) => {
              setBasket(list.map((x, i) => ({ ...x, tempId: "o" + i + Date.now() })));
              setOcrOpen(false);
            }} />
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// 圖表與資料表：共用同一組持倉估值及交易彙總

const ALLOCATION_COLORS = ["#10B981", "#60A5FA", "#FBBF24", "#A78BFA", "#FB7185", "#64748B"];

function AllocationChart({ rows, ccy }) {
  const valued = rows.filter((row) => Number.isFinite(row.marketValue) && row.marketValue > 0);
  const missing = rows.filter((row) => row.marketValue == null).length;
  const total = valued.reduce((sum, row) => sum + row.marketValue, 0);
  const slices = valued.slice(0, 5).map((row) => ({
    key: row.code, label: row.name || row.code, value: row.marketValue,
  }));
  const other = valued.slice(5).reduce((sum, row) => sum + row.marketValue, 0);
  if (other > 0) slices.push({ key: "other", label: `其他 ${valued.length - 5} 檔`, value: other });

  return <div className="fl-viz-card">
    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>持倉配置</div>
    <div style={{ fontSize: 11, color: "var(--text-4)", marginBottom: 13 }}>按可估值基金的預估市值 · {ccy}</div>
    {total > 0 ? <>
      <div role="img" aria-label={`${ccy} 持倉配置，總市值 ${fmtMoney(total, ccy)}`}
        style={{ display: "flex", width: "100%", height: 26, borderRadius: 8, overflow: "hidden", background: "var(--border)", marginBottom: 13 }}>
        {slices.map((item, i) => <div key={item.key} title={`${item.label} · ${(item.value / total * 100).toFixed(1)}%`}
          style={{ width: `${item.value / total * 100}%`, background: ALLOCATION_COLORS[i], height: "100%" }} />)}
      </div>
      {slices.map((item, i) => <div key={item.key} style={{ display: "flex", alignItems: "center", gap: 8, margin: "7px 0", fontSize: 11.5 }}>
        <span style={{ width: 9, height: 9, borderRadius: 2, background: ALLOCATION_COLORS[i], flexShrink: 0 }} />
        <span title={item.label} style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.label}</span>
        <span style={{ color: "var(--text-2)", fontVariantNumeric: "tabular-nums" }}>{(item.value / total * 100).toFixed(1)}%</span>
      </div>)}
      <div style={{ borderTop: "1px solid var(--border)", paddingTop: 9, marginTop: 9, fontSize: 11.5, color: "var(--text-3)" }}>
        已估值市值：{fmtMoney(total, ccy)}
      </div>
    </> : <p style={{ fontSize: 12, color: "var(--text-4)" }}>目前沒有可估值的持倉。</p>}
    {missing > 0 && <p style={{ fontSize: 11, color: "var(--warn)", margin: "9px 0 0" }}>
      {missing} 檔缺少淨值，未納入配置占比。
    </p>}
  </div>;
}

function CashFlowChart({ rows, ccy }) {
  const recent = rows.slice(0, 6).reverse();
  const maxAbs = Math.max(1, ...recent.map((row) => Math.abs(row.net)));
  return <div className="fl-viz-card">
    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>每月資金淨流入</div>
    <div style={{ fontSize: 11, color: "var(--text-4)", marginBottom: 13 }}>最近 {recent.length} 個有交易的月份 · {ccy}</div>
    {recent.length ? recent.map((row) => {
      const width = `${Math.abs(row.net) / maxAbs * 100}%`;
      return <div key={row.month} style={{ display: "flex", alignItems: "center", gap: 7, margin: "10px 0", fontSize: 10.5 }}>
        <span style={{ width: 42, flexShrink: 0, color: "var(--text-3)" }}>{row.month.slice(2)}</span>
        <div role="img" aria-label={`${row.month} 淨流入 ${fmtSignedMoney(row.net, ccy)}`}
          style={{ display: "flex", flex: 1, height: 17, minWidth: 0, background: "var(--surface)", borderRadius: 3, overflow: "hidden" }}>
          <div style={{ width: "50%", display: "flex", justifyContent: "flex-end", borderRight: "1px solid var(--text-4)" }}>
            {row.net < 0 && <div style={{ width, background: "var(--neg)", borderRadius: "3px 0 0 3px" }} />}
          </div>
          <div style={{ width: "50%" }}>
            {row.net > 0 && <div style={{ width, height: "100%", background: "var(--pos)", borderRadius: "0 3px 3px 0" }} />}
          </div>
        </div>
        <span title={fmtSignedMoney(row.net, ccy)} style={{ width: 78, flexShrink: 0, textAlign: "right", color: row.net < 0 ? "var(--neg)" : "var(--pos)", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
          {fmtSignedMoney(row.net, ccy)}
        </span>
      </div>;
    }) : <p style={{ fontSize: 12, color: "var(--text-4)" }}>目前沒有交易紀錄。</p>}
    <div style={{ display: "flex", gap: 14, marginTop: 13, fontSize: 10.5, color: "var(--text-4)" }}>
