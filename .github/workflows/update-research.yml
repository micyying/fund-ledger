name: Update public fund research

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 13:25 UTC = 21:25 Hong Kong time; background job does not use the reader's VPN.
    - cron: "25 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-research-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF reader
        if: ${{ github.event_name != 'push' }}
        run: python -m pip install --disable-pip-version-check "pypdf==6.1.1"
      - name: Check five official public factsheets
        if: ${{ github.event_name != 'push' }}
        run: python scripts/update_research.py
      - name: Create DeepSeek public factsheet interpretation (opt-in paid API)
        if: ${{ github.event_name != 'push' && vars.ENABLE_AI_RESEARCH == 'true' }}
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_API }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python scripts/update_analysis.py
      - name: Publish refreshed public research
        if: ${{ github.event_name != 'push' }}
        run: |
          if git diff --quiet -- research.json analysis.json; then
            echo "No public research change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.json analysis.json
          git commit -m "Refresh public fund research"
          git push
      - name: Prepare static Pages artifact
        run: |
          mkdir -p public-site
          cp index.html micy-icon.png micy-icon.svg .nojekyll research.json analysis.json public-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
